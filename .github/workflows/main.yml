name: Build My Life V2.3 Premium Executive Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V2.3 Premium
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # 4. INSTALL ANDROID SDK 35
      # ==========================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 ready"


      # ==========================================================
      # 5. GRADLE 8.9
      # ==========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================================
      # 6. FIND V2.3 PROJECT ZIP
      # ==========================================================
      - name: Find My Life V2.3 ZIP
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR MY LIFE V2.3"
          echo "========================================"

          ZIP_PATH=$(find . \
            -maxdepth 5 \
            -type f \
            \( \
              -iname "*MyLife*V2.3*.zip" \
              -o -iname "*My-Life*V2.3*.zip" \
              -o -iname "*PREMIUM*EXECUTIVE*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then

            echo "Exact V2.3 ZIP not found."
            echo "Searching for latest My Life ZIP..."

            ZIP_PATH=$(find . \
              -maxdepth 5 \
              -type f \
              \( \
                -iname "*MyLife*.zip" \
                -o -iname "*My-Life*.zip" \
              \) \
              | sort \
              | tail -n 1)

          fi

          if [ -z "$ZIP_PATH" ]; then

            echo ""
            echo "ERROR: My Life project ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 6 -type f | sort

            exit 1

          fi

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # 7. EXTRACT PROJECT
      # ==========================================================
      - name: Extract My Life V2.3
        shell: bash
        run: |
          echo "Extracting My Life V2.3..."

          rm -rf "$GITHUB_WORKSPACE/mylife_build"

          mkdir -p "$GITHUB_WORKSPACE/mylife_build"

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/mylife_build"

          echo ""
          echo "Project extracted successfully."


      # ==========================================================
      # 8. FIND ANDROID PROJECT
      # ==========================================================
      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then

            echo "ERROR: settings.gradle not found."

            echo ""
            echo "Extracted files:"

            find "$GITHUB_WORKSPACE/mylife_build" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # 9. VERIFY BASIC PROJECT STRUCTURE
      # ==========================================================
      - name: Verify Android Project
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/app/build.gradle"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/assets/index.html"

          echo ""
          echo "Android project structure verified."


      # ==========================================================
      # 10. VERIFY PACKAGE
      # ==========================================================
      - name: Verify Permanent Package
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "applicationId 'com.mylife.app'" \
            "$BUILD_FILE"

          echo ""
          echo "Package verified:"
          echo "com.mylife.app"


      # ==========================================================
      # 11. VERIFY VERSION
      # ==========================================================
      - name: Verify My Life V2.3 Version
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "versionCode 14" \
            "$BUILD_FILE"

          grep -q \
            "versionName '2.3.0'" \
            "$BUILD_FILE"

          echo ""
          echo "VERSION VERIFIED"
          echo "Version Name: 2.3.0"
          echo "Version Code: 14"


      # ==========================================================
      # 12. VERIFY PREMIUM HOME
      # ==========================================================
      - name: Verify Premium Executive Home
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Premium Executive interface..."

          if grep -q "إنجاز اليوم" "$INDEX_FILE"; then
            echo "Daily progress dashboard found"
          else
            echo "INFO: Daily progress text differs"
          fi

          if grep -q "ابدأ" "$INDEX_FILE"; then
            echo "Priority action interface found"
          else
            echo "INFO: Priority action text differs"
          fi

          echo ""
          echo "Premium Home verification completed."


      # ==========================================================
      # 13. VERIFY FIVE LIFE PILLARS
      # ==========================================================
      - name: Verify Five Life Pillars
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking life pillars..."

          grep -q "روحي" "$INDEX_FILE" || true
          grep -q "صحي" "$INDEX_FILE" || true
          grep -q "شخصي" "$INDEX_FILE" || true
          grep -q "مهني" "$INDEX_FILE" || true
          grep -q "مادي" "$INDEX_FILE" || true

          echo "Five life pillars check completed."


      # ==========================================================
      # 14. VERIFY DAILY WEIGHT LOG
      # ==========================================================
      - name: Verify Daily Weight Log
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Daily Weight Log..."

          if grep -q "تسجيل الوزن اليومي" "$INDEX_FILE"; then
            echo "Daily Weight Log found"
          else
            echo "INFO: Daily weight label differs"
          fi

          if grep -q "weightHistory" "$INDEX_FILE"; then
            echo "Weight history logic found"
          else
            echo "INFO: Weight history variable differs"
          fi

          echo "Daily weight verification completed."


      # ==========================================================
      # 15. VERIFY WEIGHT GOAL
      # ==========================================================
      - name: Verify Weight Goal System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking weight goal system..."

          if grep -q "الوزن المستهدف" "$INDEX_FILE"; then
            echo "Target weight interface found"
          else
            echo "INFO: Target weight text differs"
          fi

          if grep -q "targetWeight" "$INDEX_FILE"; then
            echo "Target weight logic found"
          else
            echo "INFO: Target weight variable differs"
          fi

          echo "Weight goal verification completed."


      # ==========================================================
      # 16. VERIFY BMI
      # ==========================================================
      - name: Verify BMI System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if grep -q "BMI" "$INDEX_FILE"; then
            echo "BMI system found"
          else
            echo "INFO: BMI text not directly detected"
          fi


      # ==========================================================
      # 17. VERIFY STEP COUNTER
      # ==========================================================
      - name: Verify Native Step Counter
        shell: bash
        run: |
          JAVA_DIR="$PROJECT_DIR/app/src/main/java"

          echo "Checking Android hardware step counter..."

          if grep -R -q \
            "TYPE_STEP_COUNTER" \
            "$JAVA_DIR"; then

            echo "Native TYPE_STEP_COUNTER found"

          else

            echo "ERROR: Native step counter missing"
            exit 1

          fi


      # ==========================================================
      # 18. VERIFY ACTIVITY PERMISSION
      # ==========================================================
      - name: Verify Activity Recognition Permission
        shell: bash
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if grep -q \
            "ACTIVITY_RECOGNITION" \
            "$MANIFEST"; then

            echo "ACTIVITY_RECOGNITION permission found"

          else

            echo "ERROR: ACTIVITY_RECOGNITION permission missing"
            exit 1

          fi


      # ==========================================================
      # 19. VERIFY FITNESS FEATURES
      # ==========================================================
      - name: Verify Fitness Dashboard
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Fitness Dashboard..."

          grep -q "الخطوات" "$INDEX_FILE" \
            && echo "Steps UI found" \
            || echo "INFO: Steps text differs"

          grep -q "كم" "$INDEX_FILE" \
            && echo "Distance UI found" \
            || echo "INFO: Distance text differs"

          grep -q "سعر" "$INDEX_FILE" \
            && echo "Calories UI found" \
            || echo "INFO: Calories text differs"

          echo ""
          echo "Fitness dashboard verification completed."


      # ==========================================================
      # 20. VERIFY CALENDAR
      # ==========================================================
      - name: Verify Calendar System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Calendar..."

          if grep -q "كل المحفوظ" "$INDEX_FILE"; then
            echo "Complete Calendar history found"
          else
            echo "INFO: Calendar history label differs"
          fi

          echo "Calendar verification completed."


      # ==========================================================
      # 21. VERIFY ADHKAR
      # ==========================================================
      - name: Verify Adhkar
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Adhkar..."

          grep -q "أذكار الصباح" "$INDEX_FILE" \
            && echo "Morning Adhkar found" \
            || echo "INFO: Morning Adhkar text differs"

          grep -q "أذكار المساء" "$INDEX_FILE" \
            && echo "Evening Adhkar found" \
            || echo "INFO: Evening Adhkar text differs"

          echo "Adhkar verification completed."


      # ==========================================================
      # 22. VERIFY QURAN
      # ==========================================================
      - name: Verify Quran
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if grep -q "القرآن" "$INDEX_FILE"; then
            echo "Quran interface found"
          else
            echo "INFO: Quran label differs"
          fi


      # ==========================================================
      # 23. VERIFY FOCUS TIMER
      # ==========================================================
      - name: Verify Focus Timer
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Focus system..."

          if grep -q "focus" "$INDEX_FILE"; then
            echo "Focus system found"
          else
            echo "INFO: Focus keyword differs"
          fi


      # ==========================================================
      # 24. VERIFY PERMANENT SIGNING KEY
      # ==========================================================
      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          echo "Searching for permanent signing key..."

          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -iname "*.jks" \
              -o -iname "*.keystore" \
            \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then

            echo ""
            echo "ERROR: Permanent signing key not found."
            echo "Build stopped to protect update compatibility."

            exit 1

          fi

          echo ""
          echo "PERMANENT SIGNING KEY FOUND:"
          echo "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # 25. BUILD SIGNED RELEASE APK
      # ==========================================================
      - name: Build Signed Release APK
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILDING"
          echo "MY LIFE V2.3 PREMIUM EXECUTIVE EDITION"
          echo "========================================"
          echo ""

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Using Gradle Wrapper"

            chmod +x ./gradlew || true

            bash ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          else

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.9"

            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          fi

          echo ""
          echo "Gradle build completed."


      # ==========================================================
      # 26. FIND SIGNED APK
      # ==========================================================
      - name: Find Signed Release APK
        shell: bash
        run: |
          echo "Searching for signed release APK..."

          APK_PATH=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then

            echo ""
            echo "ERROR: Signed Release APK not found."
            echo ""

            find \
              "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1

          fi

          echo ""
          echo "SIGNED APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # 27. VERIFY APK
      # ==========================================================
      - name: Verify Generated APK
        shell: bash
        run: |
          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK file does not exist."
            exit 1

          fi

          echo ""
          echo "APK file verified:"
          ls -lh "$APK_PATH"


      # ==========================================================
      # 28. APK INFORMATION
      # ==========================================================
      - name: Show APK Information
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          AAPT_PATH=$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aapt" \
            2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -n "$AAPT_PATH" ]; then

            echo ""
            echo "========================================"
            echo "APK INFORMATION"
            echo "========================================"

            "$AAPT_PATH" dump badging "$APK_PATH" \
              | grep -E \
                "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:" \
              || true

          else

            echo "AAPT not found - skipping package display."

          fi


      # ==========================================================
      # 29. PREPARE FINAL APK
      # ==========================================================
      - name: Prepare Final Premium APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/My-Life-V2.3-PREMIUM-EXECUTIVE.apk"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo ""
          echo "FINAL APK:"
          echo "$FINAL_APK"

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # ==========================================================
      # 30. FINAL VERIFICATION
      # ==========================================================
      - name: Final Verification
        shell: bash
        run: |
          test -f "$FINAL_APK"

          echo ""
          echo "=================================================="
          echo "MY LIFE V2.3 PREMIUM EXECUTIVE EDITION"
          echo "BUILD SUCCESSFUL"
          echo "=================================================="
          echo ""
          echo "Package:"
          echo "com.mylife.app"
          echo ""
          echo "Version:"
          echo "2.3.0"
          echo ""
          echo "Version Code:"
          echo "14"
          echo ""
          echo "PREMIUM HOME:"
          echo "- Clean executive dashboard"
          echo "- Daily progress"
          echo "- Completed goals"
          echo "- Streak"
          echo "- Today's steps"
          echo "- Priority task"
          echo "- Next prayer"
          echo "- Quick actions"
          echo "- Upcoming calendar event"
          echo "- Five life pillars"
          echo ""
          echo "HEALTH:"
          echo "- Daily weight logging"
          echo "- Historical weight logging"
          echo "- BMI"
          echo "- Healthy weight range"
          echo "- Custom target weight"
          echo "- Remaining kilograms"
          echo "- Goal completion percentage"
          echo "- Weight history"
          echo "- Weekly progress chart"
          echo "- Native step counter"
          echo "- Distance"
          echo "- Calories burned"
          echo "- Food equivalents"
          echo ""
          echo "PRODUCTIVITY:"
          echo "- Five Life Pillars"
          echo "- Goals"
          echo "- Focus Timer"
          echo "- XP"
          echo "- Levels"
          echo "- Streaks"
          echo "- Rewards"
          echo ""
          echo "SPIRITUAL:"
          echo "- Prayer times"
          echo "- Quran"
          echo "- Daily Wird"
          echo "- Quran bookmarks"
          echo "- Morning Adhkar"
          echo "- Evening Adhkar"
          echo ""
          echo "CALENDAR:"
          echo "- Week view"
          echo "- Month view"
          echo "- Year view"
          echo "- Old events"
          echo "- Current events"
          echo "- Future events"
          echo "- Repeating events"
          echo "- Android reminders"
          echo ""
          echo "SYSTEM:"
          echo "- JSON Backup"
          echo "- Import"
          echo "- Export"
          echo "- Permanent signing key"
          echo ""
          echo "FINAL APK READY"


      # ==========================================================
      # 31. UPLOAD FINAL APK
      # ==========================================================
      - name: Upload My Life V2.3 Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V2.3-PREMIUM-EXECUTIVE
          path: apk-output/My-Life-V2.3-PREMIUM-EXECUTIVE.apk
          if-no-files-found: error
          retention-days: 30

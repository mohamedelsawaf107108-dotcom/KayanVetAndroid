name: Build Kayan Vet V3.4 Verified Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Vet V3.4 Verified
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Repair Gradle Wrapper
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew || true
          fi

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Verify Project And Signing
        shell: bash
        run: |
          test -d app
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/kayan-vet-release.keystore

          grep -q "applicationId 'com.kayan.vethospital'" app/build.gradle
          grep -q "signingConfig signingConfigs.release" app/build.gradle

          echo "Project and permanent signing configuration verified."

      - name: Show App Information
        shell: bash
        run: |
          grep -E \
            "applicationId|versionCode|versionName|namespace" \
            app/build.gradle \
            || true

      - name: Build Signed Release APK
        shell: bash
        run: |
          if [ -f "gradlew" ]; then

            bash gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          else

            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          fi

      - name: Locate Signed APK
        shell: bash
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"

          APK_PATH=$(find "$RELEASE_DIR" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then

            echo "ERROR: Signed release APK not found."

            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          ls -lh "$APK_PATH"

      - name: Verify APK Container
        shell: bash
        run: |
          unzip -t "$APK_PATH"

      - name: Verify Android APK Metadata
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          PACKAGE_LINE=$("$AAPT" dump badging "$APK_PATH" \
            | grep "^package:" \
            | head -n 1)

          echo "$PACKAGE_LINE"

          PACKAGE=$(echo "$PACKAGE_LINE" \
            | awk -F"'" '{print $2}')

          VERSION_CODE=$(echo "$PACKAGE_LINE" \
            | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

          VERSION_NAME=$(echo "$PACKAGE_LINE" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          echo "Package detected: $PACKAGE"
          echo "Version code: $VERSION_CODE"
          echo "Version name: $VERSION_NAME"

          if [ "$PACKAGE" != "com.kayan.vethospital" ]; then
            echo "ERROR: Wrong package name."
            exit 1
          fi

      - name: Verify APK Signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

      - name: Verify APK Alignment
        shell: bash
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$APK_PATH"

      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
            apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk

          ls -lh \
            apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk

      - name: Upload Verified Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

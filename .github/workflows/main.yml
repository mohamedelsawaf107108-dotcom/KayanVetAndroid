name: Build Kayan Vet V3.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kayan Vet Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Project Files
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json

      - name: Build Installable Debug APK
        shell: bash
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p apk-output
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            find app/build -type f || true
            exit 1
          fi

          cp "$APK_PATH" "apk-output/Kayan-Vet-Hospital-V3.3.0.apk"

          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.3.0
          path: apk-output/Kayan-Vet-Hospital-V3.3.0.apk
          if-no-files-found: error
          retention-days: 30

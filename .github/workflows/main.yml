name: Build Kayan Equine APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build Kayan Equine APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # FIND KAYAN ZIP
      # ==========================================

      - name: Find Kayan ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " KAYAN EQUINE CLINICAL ASSISTANT"
          echo "======================================"

          echo "Searching for Kayan ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*Kayan*Equine*Clinical*Assistant*.zip" \
            -o -iname "*Kayan*Equine*.zip" \
            -o -iname "*Kayan*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kayan ZIP file not found"
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Kayan Project
        shell: bash
        run: |
          set -e

          rm -rf kayan-build
          mkdir kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo "ZIP extracted successfully"

          find kayan-build -maxdepth 4 -type f | head -100


      # ==========================================
      # LOCATE ANDROID PROJECT
      # ==========================================

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find kayan-build -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find kayan-build -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android Project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Kayan Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/www/index.html" ]; then
            echo "ERROR: Kayan index.html not found"
            exit 1
          fi

          echo "Kayan Android project verified successfully"


      # ==========================================
      # REMOVE BROKEN GRADLE WRAPPER
      # ==========================================

      - name: Disable Broken Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          rm -f gradlew
          rm -f gradlew.bat

          echo "Local Gradle wrapper disabled"
          echo "GitHub Gradle 8.9 will be used"


      # ==========================================
      # CHECK GRADLE
      # ==========================================

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING KAYAN EQUINE APK"
          echo "======================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Build completed"


      # ==========================================
      # FIND GENERATED APK
      # ==========================================

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK not generated"

            find "$PROJECT_DIR/app/build" -type f || true

            exit 1

          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p final-apk

          cp "$APK_FILE" \
            final-apk/Kayan-Equine-Clinical-Assistant.apk

          echo ""
          echo "======================================"
          echo " KAYAN EQUINE APK READY"
          echo "======================================"

          ls -lh final-apk/Kayan-Equine-Clinical-Assistant.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Kayan APK
        uses: actions/upload-artifact@v4
        with:

          name: Kayan-Equine-Clinical-Assistant-APK

          path: final-apk/Kayan-Equine-Clinical-Assistant.apk

          if-no-files-found: error

          retention-days: 30

name: Build Kayan Vet V3.4 Verified Signed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Vet V3.4 Verified
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate Or Extract Kayan Vet Project
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR KAYAN VET PROJECT"
          echo "========================================"

          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            ZIP_PATH=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              \( \
                -iname "*KayanVet*.zip" \
                -o -iname "*Kayan*Vet*.zip" \
                -o -iname "*KAYAN*.zip" \
                -o -iname "*.zip" \
              \) \
              | head -n 1)

            if [ -z "$ZIP_PATH" ]; then
              echo "ERROR: No project or ZIP found."
              find "$GITHUB_WORKSPACE" -maxdepth 8 -type f | sort
              exit 1
            fi

            rm -rf "$GITHUB_WORKSPACE/kayan_build"
            mkdir -p "$GITHUB_WORKSPACE/kayan_build"

            unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/kayan_build"

            SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/kayan_build" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)
          fi

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

      - name: Repair Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew || true
          fi

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Verify Project Structure
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

          echo "BUILD FILE:"
          echo "$BUILD_FILE"

      - name: Show Application Information
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FILE INFORMATION"
          echo "========================================"

          cat "$BUILD_FILE" | grep -E \
            "applicationId|namespace|versionCode|versionName" \
            || true

          echo ""
          echo "MANIFEST PACKAGE INFO:"
          grep -E \
            "package=|android:name=" \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml" \
            | head -20 \
            || true

      - name: Locate Signing Key
        shell: bash
        run: |
          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( -iname "*.jks" -o -iname "*.keystore" \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then
            echo "ERROR: Signing key not found."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "SIGNING KEY FOUND:"
          echo "$KEYSTORE_PATH"

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew || true

            bash gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          else
            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          fi

      - name: Find Release APK
        shell: bash
        run: |
          RELEASE_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          echo "RELEASE FILES:"
          find "$RELEASE_DIR" \
            -type f \
            -maxdepth 2 \
            -print \
            || true

          APK_PATH=$(find "$RELEASE_DIR" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed APK not found."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          ls -lh "$APK_PATH"

      - name: Verify APK Container
        shell: bash
        run: |
          unzip -t "$APK_PATH"

          echo "APK container valid."

      - name: Verify APK Metadata
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          PACKAGE_LINE=$("$AAPT" dump badging "$APK_PATH" \
            | grep "^package:" \
            | head -n 1)

          echo "PACKAGE LINE:"
          echo "$PACKAGE_LINE"

          PACKAGE=$(echo "$PACKAGE_LINE" | awk -F"'" '{print $2}')

          VERSION_CODE=$(echo "$PACKAGE_LINE" \
            | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

          VERSION_NAME=$(echo "$PACKAGE_LINE" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          echo ""
          echo "Package detected: $PACKAGE"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Could not read package name."
            exit 1
          fi

          echo "APK package read successfully."

      - name: Verify APK Signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

          echo "APK signature valid."

      - name: Verify APK Alignment
        shell: bash
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$APK_PATH"

          echo "APK alignment valid."

      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

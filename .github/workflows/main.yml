name: Deploy Kayan Equine Clinical Assistant

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    name: Build Kayan Equine Clinical Assistant
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Files
        shell: bash
        run: |
          echo "Checking Kayan Equine Clinical Assistant files..."

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "index.html found"

          if [ -f "manifest.webmanifest" ]; then
            echo "manifest.webmanifest found"
          else
            echo "WARNING: manifest.webmanifest not found"
          fi

          if [ -f "service-worker.js" ]; then
            echo "service-worker.js found"
          else
            echo "WARNING: service-worker.js not found"
          fi

          echo "Kayan Equine Clinical Assistant verification completed"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Kayan Web App
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy Kayan Equine App
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

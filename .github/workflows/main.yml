name: Build Kayan Vet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q "KayanVetAndroid_ANDROIDIDE_FIXED-1.zip" -d extracted
          echo "Project extracted"
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found after extraction"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk

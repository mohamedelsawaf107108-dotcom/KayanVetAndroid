name: Build My Life V1.5 Permanent Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"


      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Find And Extract My Life V1.5
        shell: bash
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -type f \
            -name "*MyLife*V1.5*.zip" \
            | head -n 1)

          if [ -n "$ZIP_PATH" ]; then

            echo "ZIP found:"
            echo "$ZIP_PATH"

            rm -rf mylife_build
            mkdir -p mylife_build

            unzip -q "$ZIP_PATH" -d mylife_build

            SETTINGS=$(find mylife_build \
              -type f \
              -name settings.gradle \
              | head -n 1)

          else

            echo "No ZIP found. Searching extracted project..."

            SETTINGS=$(find . \
              -maxdepth 3 \
              -type f \
              -name settings.gradle \
              | head -n 1)

          fi


          if [ -z "$SETTINGS" ]; then

            echo "ERROR: settings.gradle not found"

            echo "Repository files:"
            find . -maxdepth 3 -type f

            exit 1

          fi


          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android Project:"
          echo "$PROJECT_DIR"


      - name: Verify Permanent Signing Files
        shell: bash
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"

          test -f "$PROJECT_DIR/app/mylife-release.jks"

          grep -q "applicationId 'com.mylife.app'" \
            "$PROJECT_DIR/app/build.gradle"

          grep -q "versionName '1.5.0'" \
            "$PROJECT_DIR/app/build.gradle"

          echo "Permanent signing configuration verified."


      - name: Build Permanent Signed Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon


      - name: Verify Signed APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          apksigner verify \
            --verbose \
            "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "Signed APK verified successfully."


      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
             apk-output/My-Life-V1.5-PERMANENT-SIGNED.apk

          ls -lh apk-output


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V1.5-PERMANENT-SIGNED
          path: apk-output/My-Life-V1.5-PERMANENT-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

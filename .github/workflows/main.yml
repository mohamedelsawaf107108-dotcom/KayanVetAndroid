name: Build Kayan Equine APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Equine APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installed"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ========================================
      # FIND KAYAN ZIP
      # ========================================

      - name: Find Kayan ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Kayan ZIP..."

          ZIP_FILE=$(find . -type f \
            -iname "*Kayan*Equine*Clinical*Assistant*APK*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kayan ZIP not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ========================================
      # EXTRACT ZIP
      # ========================================

      - name: Extract Kayan Project
        shell: bash
        run: |
          set -e

          rm -rf kayan-build

          mkdir -p kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo "ZIP extracted successfully"

      # ========================================
      # LOCATE ANDROID PROJECT
      # ========================================

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find kayan-build \
            -type f \
            -name "settings.gradle" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ========================================
      # FIND / COPY INDEX.HTML
      # ========================================

      - name: Prepare Kayan Application
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$PROJECT_DIR/app/src/main/assets/www"

          if [ ! -f \
            "$PROJECT_DIR/app/src/main/assets/www/index.html" ]; then

            INDEX_FILE=$(find kayan-build \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX_FILE" ]; then

              INDEX_FILE=$(find . \
                -type f \
                -name "index.html" \
                ! -path "./kayan-build/*" \
                | head -n 1)

            fi

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            cp "$INDEX_FILE" \
              "$PROJECT_DIR/app/src/main/assets/www/index.html"

          fi

          echo "Kayan index.html ready"

          ls -lh \
            "$PROJECT_DIR/app/src/main/assets/www/index.html"

      # ========================================
      # CREATE LOCAL.PROPERTIES
      # ========================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          cat "$PROJECT_DIR/local.properties"

      # ========================================
      # VERIFY PROJECT
      # ========================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "KAYAN EQUINE CLINICAL ASSISTANT"
          echo "======================================"

          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -d app
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/www/index.html

          echo "Android project verified successfully"

      # ========================================
      # BUILD
      # ========================================

      - name: Build Kayan APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Starting Kayan APK build..."
          echo ""

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ========================================
      # FIND APK
      # ========================================

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK not found"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          mkdir -p final-apk

          cp "$APK_FILE" \
            final-apk/Kayan-Equine-Clinical-Assistant.apk

          echo ""
          echo "======================================"
          echo "KAYAN EQUINE APK READY"
          echo "======================================"

          ls -lh \
            final-apk/Kayan-Equine-Clinical-Assistant.apk

      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload Kayan APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Equine-Clinical-Assistant-APK
          path: final-apk/Kayan-Equine-Clinical-Assistant.apk
          if-no-files-found: error
          retention-days: 30

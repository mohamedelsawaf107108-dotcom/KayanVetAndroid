name: Build Kayan Vet V3.4 Verified Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Vet V3.4 Verified
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate Or Extract Project
        shell: bash
        run: |
          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then

            ZIP_PATH=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              \( \
                -iname "*KayanVet*.zip" \
                -o -iname "*Kayan*Vet*.zip" \
                -o -iname "*KAYAN*.zip" \
              \) \
              | head -n 1)

            if [ -z "$ZIP_PATH" ]; then
              echo "ERROR: Kayan Vet Android project not found."
              find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | sort
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_PATH"

            rm -rf "$GITHUB_WORKSPACE/kayan_build"
            mkdir -p "$GITHUB_WORKSPACE/kayan_build"

            unzip -q "$ZIP_PATH" \
              -d "$GITHUB_WORKSPACE/kayan_build"

            SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/kayan_build" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)
          fi

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Repair Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew || true
          fi

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Verify Project And Signing
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/kayan-vet-release.keystore"

          grep -q "applicationId 'com.kayan.vethospital'" \
            "$PROJECT_DIR/app/build.gradle"

          grep -q "signingConfig signingConfigs.release" \
            "$PROJECT_DIR/app/build.gradle"

          echo "Permanent signing configuration found."

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            bash gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          else
            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          fi

      - name: Locate Release APK
        shell: bash
        run: |
          RELEASE_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          echo "Files in release folder:"
          find "$RELEASE_DIR" -type f -maxdepth 2 -print || true

          APK_PATH=$(find "$RELEASE_DIR" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No signed APK found."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          ls -lh "$APK_PATH"

      - name: Verify APK ZIP Structure
        shell: bash
        run: |
          unzip -t "$APK_PATH"

          echo "APK ZIP structure is valid."

      - name: Verify Android APK Metadata
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK_PATH" | head -20

          PACKAGE=$("$AAPT" dump badging "$APK_PATH" \
            | grep "^package:" \
            | sed -n "s/.*name='\([^']*\)'.*/\1/p")

          echo "Package detected: $PACKAGE"

          if [ "$PACKAGE" != "com.kayan.vethospital" ]; then
            echo "ERROR: Wrong package name."
            exit 1
          fi

      - name: Verify APK Signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

          echo "APK signature verified successfully."

      - name: Verify ZIP Alignment
        shell: bash
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -c -v 4 "$APK_PATH"

          echo "APK alignment verified."

      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      - name: Final Information
        shell: bash
        run: |
          echo "========================================"
          echo "KAYAN VET APK VERIFIED"
          echo "========================================"
          echo ""
          echo "Package: com.kayan.vethospital"
          echo "Version: 3.4.0"
          echo ""
          echo "APK structure: VALID"
          echo "APK signature: VALID"
          echo "ZIP alignment: VALID"
          echo ""
          echo "SAFE TO INSTALL"

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.4.0-VERIFIED-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Vet V3.4 Safe Signed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix wrapper
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: Verify permanent signing key
        shell: bash
        run: |
          test -f app/kayan-vet-release.keystore
          grep -q "signingConfig signingConfigs.release" app/build.gradle
          grep -q "applicationId 'com.kayan.vethospital'" app/build.gradle
          grep -q "versionCode 28" app/build.gradle
          echo "Permanent Kayan signing configuration verified."

      - name: Build signed release APK
        shell: bash
        run: |
          gradle clean assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: signed app-release.apk not found"

            find app/build/outputs \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1
          fi

          if find app/build/outputs/apk/release \
            -name '*unsigned*.apk' \
            | grep -q .; then

            echo "Unsigned APK may also exist, but it will NOT be uploaded."
          fi

          mkdir -p apk-output

          cp "$APK" \
            apk-output/Kayan-Vet-Hospital-V3.4.0-SAFE-SIGNED.apk

          ls -lh \
            apk-output/Kayan-Vet-Hospital-V3.4.0-SAFE-SIGNED.apk

      - name: Upload signed APK only
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.4.0-SAFE-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.4.0-SAFE-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Vet V3.1.2 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and Extract Kayan Vet V3.1.2
        shell: bash
        run: |
          set -e

          echo "Searching for Kayan Vet V3.1.2 ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -name "KayanVetAndroid_V3.1.2_REVENUE_CRASH_FIXED_FIXED_SIGNING*.zip" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kayan Vet V3.1.2 ZIP file was not found."
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          echo "Extracting Android project..."
          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found after extraction."
            find extracted_project -maxdepth 4 -type f
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Required Project Files
        shell: bash
        run: |
          set -e

          echo "Checking required Android files..."

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/google-services.json"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          test -f "$PROJECT_DIR/app/kayan-vet-release.keystore"

          echo "All required files found."

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo "android.useAndroidX=true" \
              >> "$PROJECT_DIR/gradle.properties"
          fi

          if grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties"; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo "android.enableJetifier=true" \
              >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "AndroidX enabled."

      - name: Verify Core Features
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Firestore sync..."
          grep -q "AndroidBridge.syncData" "$HTML"

          echo "Checking safe merge..."
          grep -q "kayanSafeMergeDB" "$HTML"

          echo "Checking Full Backup..."
          grep -q "exportFullBackup" "$HTML"

          echo "Checking Restore Backup..."
          grep -q "restoreFullBackupFile" "$HTML"

          echo "Checking administrator permissions..."
          grep -q "requireAdmin" "$HTML"

          echo "Checking normal-user view-only mode..."
          grep -q "readonly-user" "$HTML"

          echo "Checking medicine stock requests..."
          grep -q "openStockModal('medicine','in')" "$HTML"
          grep -q "openStockModal('medicine','out')" "$HTML"

          echo "Checking feed stock requests..."
          grep -q "openStockModal('feed','in')" "$HTML"
          grep -q "openStockModal('feed','out')" "$HTML"

          echo "Core features verified."

      - name: Verify Revenue Crash Fix
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking revenue title metadata..."
          grep -q "revenues:\\['إيرادات المستشفى','تسجيل الخدمات والإيرادات ومتابعة الإجمالي'\\]" "$HTML"

          echo "Checking safe page title fallback..."
          grep -q "const meta=titles\\[id\\]||\\[id,''\\]" "$HTML"

          echo "Revenue crash fix verified."

      - name: Verify Easy Date Entry
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "kayanDateTyping" "$HTML"
          grep -q "29082026" "$HTML"

          echo "Easy date entry verified."

      - name: Verify Hospital Revenue Section
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking revenue page..."
          grep -q 'id="revenues"' "$HTML"

          echo "Checking revenue navigation..."
          grep -q 'data-view="revenues"' "$HTML"

          echo "Checking revenue dashboard shortcut..."
          grep -q "revenue-dashboard-shortcut" "$HTML"

          echo "Checking revenue functions..."
          grep -q "openRevenueModal" "$HTML"
          grep -q "saveRevenue" "$HTML"
          grep -q "deleteRevenue" "$HTML"
          grep -q "renderRevenues" "$HTML"

          echo "Checking revenue totals..."
          grep -q "revenueTotal" "$HTML"
          grep -q "revenueCount" "$HTML"
          grep -q "revenueMonth" "$HTML"

          echo "Hospital revenue section verified."

      - name: Verify Horse QR
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          grep -q "openHorseQR" "$HTML"
          grep -q "generateQr" "$HTML"
          grep -q "generateQr" "$MAIN"

          echo "Horse QR verified."

      - name: Verify Horse Comprehensive Report
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking horse report..."
          grep -q "openHorseReport" "$HTML"
          grep -q "printHorseReport" "$HTML"

          echo "Checking medical history..."
          grep -q "الحالات المرضية" "$HTML"

          echo "Checking medication history..."
          grep -q "الأدوية المصروفة للحصان" "$HTML"

          echo "Checking current feeding schedule..."
          grep -q "برنامج التغذية الحالي" "$HTML"

          echo "Checking feeding change history..."
          grep -q "سجل تغييرات العلف" "$HTML"
          grep -q "recordFeedingChange" "$HTML"

          echo "Horse comprehensive report verified."

      - name: Verify PDF and Printing
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          echo "Checking PDF / print functions..."
          grep -q "printReportElement" "$HTML"
          grep -q "printReportHtml" "$HTML"
          grep -q "printCurrentPage" "$MAIN"
          grep -q "PrintManager" "$MAIN"

          echo "Checking signature..."
          grep -q "الرائد / محمد الصواف" "$HTML"
          grep -q "رئيس القسم البيطري" "$HTML"

          echo "PDF / print verified."

      - name: Verify Firestore Collections
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          echo "Checking Firestore collections..."

          grep -q '"medicines"' "$MAIN"
          grep -q '"feed"' "$MAIN"
          grep -q '"horses"' "$MAIN"
          grep -q '"cases"' "$MAIN"
          grep -q '"moves"' "$MAIN"
          grep -q '"revenues"' "$MAIN"

          echo "Firestore collections verified."

      - name: Verify Fixed Signing
        shell: bash
        run: |
          set -e

          echo "Checking fixed signing key..."

          test -f "$PROJECT_DIR/app/kayan-vet-release.keystore"

          grep -q "signingConfigs" "$PROJECT_DIR/app/build.gradle"
          grep -q "release" "$PROJECT_DIR/app/build.gradle"

          echo "Fixed signing verified."

      - name: Build Signed Release APK
        shell: bash
        run: |
          set -e

          echo "Starting Android release build..."

          cd "$PROJECT_DIR"

          gradle assembleRelease --stacktrace

          echo "Gradle build completed."

      - name: Find Generated Release APK
        shell: bash
        run: |
          set -e

          echo "Searching for release APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "Verifying APK signature..."

          jarsigner -verify "$APK"

          echo "APK signature verified."

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          cp "$APK" \
            "apk-output/Kayan-Vet-Hospital-V3.1.2-SIGNED.apk"

          echo "Final APK prepared:"
          ls -lh apk-output/

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.1.2-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.1.2-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

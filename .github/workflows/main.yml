name: Build Kayan Equine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Kayan Equine APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. SETUP ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " INSTALLING ANDROID SDK"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready"
          echo "ANDROID_HOME=$ANDROID_HOME"


      # ==========================================
      # 4. SETUP GRADLE
      # ==========================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # 5. FIND KAYAN ZIP
      # ==========================================

      - name: Find Kayan ZIP
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo " SEARCHING FOR KAYAN ZIP"
          echo "======================================"
          echo ""

          echo "Available ZIP files:"
          find . -type f -iname "*.zip" -print || true

          ZIP_FILE=""

          ZIP_FILE=$(find . -type f \
            -iname "*Kayan*Equine*Clinical*Assistant*FIXED*.zip" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*Equine*Clinical*Assistant*CLEAN*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*Equine*Clinical*Assistant*FINAL*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*Equine*Clinical*Assistant*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Kayan ZIP not found"
            exit 1
          fi

          echo ""
          echo "Kayan ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. EXTRACT PROJECT
      # ==========================================

      - name: Extract Kayan Project
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo " EXTRACTING KAYAN PROJECT"
          echo "======================================"

          rm -rf kayan-build
          mkdir -p kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo ""
          echo "Extraction completed"

          echo ""
          echo "Extracted files:"
          find kayan-build -maxdepth 5 -type f | head -200


      # ==========================================
      # 7. LOCATE ANDROID PROJECT
      # ==========================================

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo ""
          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find kayan-build \
            -type f \
            -name "settings.gradle" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find kayan-build \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. PREPARE INDEX.HTML
      # ==========================================

      - name: Prepare Kayan index.html
        shell: bash
        run: |
          set -e

          TARGET_DIR="$PROJECT_DIR/app/src/main/assets/www"

          mkdir -p "$TARGET_DIR"

          if [ -f "$TARGET_DIR/index.html" ]; then

            echo ""
            echo "index.html already exists"

          else

            echo ""
            echo "Searching for index.html..."

            INDEX_FILE=$(find kayan-build \
              -type f \
              -iname "index.html" \
              | head -n 1 || true)

            if [ -z "$INDEX_FILE" ]; then

              INDEX_FILE=$(find . \
                -type f \
                -iname "index.html" \
                ! -path "./kayan-build/*" \
                | head -n 1 || true)

            fi

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            echo ""
            echo "index.html FOUND:"
            echo "$INDEX_FILE"

            cp "$INDEX_FILE" \
              "$TARGET_DIR/index.html"

          fi

          echo ""
          echo "Final index.html:"
          ls -lh "$TARGET_DIR/index.html"


      # ==========================================
      # 9. CONFIGURE ANDROID SDK PATH
      # ==========================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          echo "local.properties:"
          cat "$PROJECT_DIR/local.properties"


      # ==========================================
      # 10. FIX JAVA CODE AUTOMATICALLY
      # ==========================================

      - name: Fix MainActivity Java
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/equine/MainActivity.java"

          echo ""
          echo "======================================"
          echo " FIXING MAINACTIVITY.JAVA"
          echo "======================================"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          # Remove Windows CRLF
          sed -i 's/\r$//' "$MAIN"

          # Fix PrintManager wrong package
          sed -i \
            's/import android\.app\.PrintManager;/import android.print.PrintManager;/' \
            "$MAIN"

          # Also fix if PrintManager import is missing
          if ! grep -q "import android.print.PrintManager;" "$MAIN"; then
            sed -i \
              '/import android.app.Activity;/a import android.print.PrintManager;' \
              "$MAIN"
          fi

          # Fix invalid MainActivity.super call if it exists
          sed -i \
            's/MainActivity\.super\.onBackPressed();/finish();/' \
            "$MAIN"

          echo ""
          echo "PrintManager check:"
          grep "PrintManager" "$MAIN" || true

          echo ""
          echo "MainActivity fixed successfully"


      # ==========================================
      # 11. REPAIR PROJECT FILES
      # ==========================================

      - name: Repair Android Project Files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " REPAIRING ANDROID PROJECT"
          echo "======================================"

          find . \
            -type f \
            \( -name "*.gradle" \
            -o -name "*.java" \
            -o -name "*.xml" \) \
            -exec sed -i 's/\r$//' {} \; || true

          # Remove broken wrapper
          rm -f gradlew
          rm -f gradlew.bat

          echo ""
          echo "Using GitHub Gradle 8.9"


      # ==========================================
      # 12. VERIFY PROJECT
      # ==========================================

      - name: Verify Kayan Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " VERIFYING KAYAN PROJECT"
          echo "======================================"
          echo ""

          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle missing"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle missing"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/www/index.html" ]; then
            echo "ERROR: index.html missing"
            exit 1
          fi

          if [ ! -f \
            "app/src/main/java/com/kayan/equine/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java missing"
            exit 1
          fi

          echo ""
          echo "PROJECT VERIFIED SUCCESSFULLY"


      # ==========================================
      # 13. CHECK ENVIRONMENT
      # ==========================================

      - name: Check Build Environment
        shell: bash
        run: |
          echo ""
          echo "JAVA VERSION"
          java -version

          echo ""
          echo "GRADLE VERSION"
          gradle --version

          echo ""
          echo "ANDROID SDK"
          echo "$ANDROID_HOME"


      # ==========================================
      # 14. BUILD APK
      # ==========================================

      - name: Build Kayan APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " BUILDING KAYAN EQUINE APK"
          echo "======================================"
          echo ""

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo " BUILD COMPLETED"
          echo "======================================"


      # ==========================================
      # 15. FIND GENERATED APK
      # ==========================================

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)

          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p final-apk

          cp "$APK_FILE" \
            final-apk/Kayan-Equine-Clinical-Assistant.apk

          echo ""
          echo "======================================"
          echo " KAYAN EQUINE APK READY"
          echo "======================================"

          ls -lh \
            final-apk/Kayan-Equine-Clinical-Assistant.apk


      # ==========================================
      # 16. UPLOAD APK
      # ==========================================

      - name: Upload Kayan APK
        uses: actions/upload-artifact@v4
        with:

          name: Kayan-Equine-Clinical-Assistant-APK

          path: final-apk/Kayan-Equine-Clinical-Assistant.apk

          if-no-files-found: error

          retention-days: 30

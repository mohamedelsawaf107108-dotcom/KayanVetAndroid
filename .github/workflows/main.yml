name: Build My Life V1.6 Permanent Update APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V1.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find And Extract My Life V1.6 ZIP
        shell: bash
        run: |
          ZIP_PATH=$(find . -maxdepth 3 -type f -iname "*MyLife*V1.6*.zip" | head -n 1)

          if [ -n "$ZIP_PATH" ]; then
            echo "Found ZIP: $ZIP_PATH"
            rm -rf "$GITHUB_WORKSPACE/mylife_build"
            mkdir -p "$GITHUB_WORKSPACE/mylife_build"
            unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/mylife_build"
            SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" -type f -name settings.gradle | head -n 1)
          else
            echo "No V1.6 ZIP found; trying extracted project in repository."
            SETTINGS_PATH=$(find . -maxdepth 4 -type f -name settings.gradle | head -n 1)
          fi

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Verify Permanent Update Identity
        shell: bash
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/mylife-release.jks"
          grep -q "applicationId 'com.mylife.app'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 7" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.6.0'" "$PROJECT_DIR/app/build.gradle"
          echo "Package: com.mylife.app"
          echo "Version: 1.6.0 (7)"
          echo "Permanent release keystore found."

      - name: Build Signed Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --stacktrace --no-daemon

      - name: Find Signed APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" | grep -v unsigned | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: signed release APK not found"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp "$APK_PATH" "apk-output/My-Life-V1.6-PERMANENT-UPDATE.apk"
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V1.6-PERMANENT-UPDATE
          path: apk-output/My-Life-V1.6-PERMANENT-UPDATE.apk
          if-no-files-found: error
          retention-days: 30

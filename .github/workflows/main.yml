name: Build Kayan Vet V3.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kayan Vet Android
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1) Checkout repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2) Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3) Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==========================================
      # 4) Find V3.3.0 ZIP
      # ==========================================
      - name: Find Kayan Vet V3.3.0 ZIP
        shell: bash
        run: |
          echo "Searching for Kayan Vet V3.3.0 ZIP..."

          ZIP_PATH=$(find . -maxdepth 2 -type f \
            -name "KayanVetAndroid_V3.3.0_GITHUB_ONE_CLICK_COMPLETE.zip" \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then

            ZIP_PATH=$(find . -maxdepth 2 -type f \
              -name "*V3.3.0*ONE_CLICK*.zip" \
              | head -n 1)

          fi

          if [ -z "$ZIP_PATH" ]; then

            ZIP_PATH=$(find . -maxdepth 2 -type f \
              -name "*V3.3.0*.zip" \
              | head -n 1)

          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: V3.3.0 ZIP not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      # ==========================================
      # 5) Extract project
      # ==========================================
      - name: Extract Kayan Vet Project
        shell: bash
        run: |
          echo "Extracting project..."

          rm -rf kayan_build
          mkdir -p kayan_build

          unzip -q "$ZIP_PATH" -d kayan_build

          echo "Extraction completed successfully."


      # ==========================================
      # 6) Find Android project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."

          SETTINGS_PATH=$(find kayan_build \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Android project not found."
            find kayan_build -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 7) Verify Android files
      # ==========================================
      - name: Verify Android Project
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "Android project files:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "App files:"
          ls -la "$PROJECT_DIR/app"


      # ==========================================
      # 8) Fix Gradle Wrapper
      # ==========================================
      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then

            echo "gradlew found."

            # Fix Windows CRLF
            sed -i 's/\r$//' gradlew

            chmod +x gradlew

            echo "gradlew fixed and executable."

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

          else

            echo "gradlew not found."
            echo "Using installed Gradle."

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 9) Show versions
      # ==========================================
      - name: Show Java and Gradle Versions
        shell: bash
        run: |
          java -version

          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then

            echo "Trying Gradle Wrapper..."

            if ./gradlew --version; then

              echo "Gradle Wrapper works."
              echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"

            else

              echo "Wrapper failed."
              echo "Using system Gradle instead."

              gradle --version

              echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"

            fi

          else

            gradle --version

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 10) Check Firebase
      # ==========================================
      - name: Check Firebase Configuration
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then

            echo "google-services.json found."

          else

            echo "WARNING:"
            echo "google-services.json not found."
            echo "Continuing build..."

          fi


      # ==========================================
      # 11) Clean project
      # ==========================================
      - name: Clean Android Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          $GRADLE_COMMAND clean --stacktrace


      # ==========================================
      # 12) Build Debug APK
      # ==========================================
      - name: Build Kayan Vet APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building Kayan Vet V3.3.0..."

          $GRADLE_COMMAND assembleDebug --stacktrace


      # ==========================================
      # 13) Find generated APK
      # ==========================================
      - name: Find Generated APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then

            echo "ERROR: APK not generated."

            echo ""
            echo "Build output files:"

            find "$PROJECT_DIR/app/build" -type f || true

            exit 1

          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ==========================================
      # 14) Prepare final APK
      # ==========================================
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
            "apk-output/Kayan-Vet-Hospital-V3.3.0.apk"

          echo ""
          echo "Final APK:"
          ls -lh apk-output


      # ==========================================
      # 15) Upload APK
      # ==========================================
      - name: Upload Kayan Vet APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.3.0
          path: apk-output/Kayan-Vet-Hospital-V3.3.0.apk
          if-no-files-found: error
          retention-days: 30

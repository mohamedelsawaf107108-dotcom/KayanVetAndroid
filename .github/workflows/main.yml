name: Build Kayan Vet V3.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kayan Vet Android
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      - name: Find Kayan Vet V3.3.0 ZIP
        shell: bash
        run: |
          echo "Searching for Kayan Vet V3.3.0 ZIP..."

          ZIP_PATH=$(find . -maxdepth 2 -type f \
            -name "KayanVetAndroid_V3.3.0_GITHUB_ONE_CLICK_COMPLETE.zip" \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "Exact ZIP name not found."
            echo "Trying to find any V3.3.0 GitHub ZIP..."

            ZIP_PATH=$(find . -maxdepth 2 -type f \
              -name "*V3.3.0*GITHUB*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: Kayan Vet V3.3.0 ZIP not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      - name: Extract Kayan Vet Project
        shell: bash
        run: |
          echo "Extracting project..."

          rm -rf kayan_build
          mkdir -p kayan_build

          unzip -q "$ZIP_PATH" -d kayan_build

          echo "Extraction completed."

          echo "Extracted folders:"
          find kayan_build -maxdepth 3 -type d

          echo "Extracted files:"
          find kayan_build -maxdepth 3 -type f | head -100


      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS_PATH=$(find kayan_build \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            find kayan_build -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      - name: Verify Android App
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Android app folder found."

          echo ""
          echo "App files:"
          ls -la "$PROJECT_DIR/app"


      - name: Check Firebase File
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "Firebase google-services.json found."
          else
            echo "WARNING: google-services.json not found."
            echo "Build will continue."
          fi


      - name: Prepare Gradle
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then

            echo "Gradle Wrapper found."

            chmod +x "$PROJECT_DIR/gradlew"

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

          else

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.11.1."

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"

          fi


      - name: Show Versions
        shell: bash
        run: |
          java -version

          if [ "$USE_WRAPPER" = "true" ]; then
            cd "$PROJECT_DIR"
            ./gradlew --version
          else
            gradle --version
          fi


      - name: Clean Android Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew clean --stacktrace
          else
            gradle clean --stacktrace
          fi


      - name: Build Installable APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building Kayan Vet V3.3.0..."

          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi


      - name: Find Generated APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."

            echo "Build output:"
            find "$PROJECT_DIR/app/build" -type f || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      - name: Prepare Final Kayan Vet APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
            "apk-output/Kayan-Vet-Hospital-V3.3.0.apk"

          echo ""
          echo "Final APK:"
          ls -lh apk-output


      - name: Upload Kayan Vet APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.3.0
          path: apk-output/Kayan-Vet-Hospital-V3.3.0.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Vet V2.9.1 Gradle Fixed Firestore APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'KayanVetAndroid_V2.9.1_GRADLE_FIXED_FIRESTORE.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "KayanVetAndroid_V2.9.1_GRADLE_FIXED_FIRESTORE.zip" -d extracted

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          touch "$PROJECT_DIR/gradle.properties"

          grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties" \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT_DIR/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties" \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROJECT_DIR/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          echo "----- gradle.properties -----"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Check Firebase configuration
        shell: bash
        run: |
          set -e

          FIREBASE_FILE="${{ steps.project.outputs.dir }}/app/google-services.json"

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          echo "Firebase configuration found successfully"

      - name: Check bundled PC backup
        shell: bash
        run: |
          set -e

          BACKUP="${{ steps.project.outputs.dir }}/app/src/main/assets/computer_backup.json"

          if [ ! -f "$BACKUP" ]; then
            echo "ERROR: computer_backup.json not found"
            exit 1
          fi

          echo "PC backup found successfully"

      - name: Check Firestore automatic sync
        shell: bash
        run: |
          set -e

          INDEX_FILE="${{ steps.project.outputs.dir }}/app/src/main/assets/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          if ! grep -q "syncCloud" "$INDEX_FILE"; then
            echo "ERROR: Firestore sync function not found"
            exit 1
          fi

          if ! grep -q "AndroidBridge.syncData" "$INDEX_FILE"; then
            echo "ERROR: Android Firestore bridge not found"
            exit 1
          fi

          echo "Firestore automatic sync found successfully"

      - name: Check corrected feed calculation
        shell: bash
        run: |
          set -e

          INDEX_FILE="${{ steps.project.outputs.dir }}/app/src/main/assets/index.html"

          if ! grep -q "v2FeedStockKg" "$INDEX_FILE"; then
            echo "ERROR: Corrected feed calculation not found"
            exit 1
          fi

          echo "Corrected feed calculation found successfully"

      - name: Check horse work and rest status
        shell: bash
        run: |
          set -e

          INDEX_FILE="${{ steps.project.outputs.dir }}/app/src/main/assets/index.html"

          if ! grep -q "workStatus" "$INDEX_FILE"; then
            echo "ERROR: Horse work/rest status not found"
            exit 1
          fi

          echo "Horse work/rest status found successfully"

      - name: Check horse QR feature
        shell: bash
        run: |
          set -e

          INDEX_FILE="${{ steps.project.outputs.dir }}/app/src/main/assets/index.html"

          if ! grep -q "openHorseQR" "$INDEX_FILE"; then
            echo "ERROR: Horse QR feature not found"
            exit 1
          fi

          echo "Horse QR feature found successfully"

      - name: Check daily rest horses notification
        shell: bash
        run: |
          set -e

          WORKER="${{ steps.project.outputs.dir }}/app/src/main/java/com/kayan/vethospital/RestHorsesWorker.java"

          if [ ! -f "$WORKER" ]; then
            echo "ERROR: RestHorsesWorker.java not found"
            exit 1
          fi

          echo "Daily rest horses notification found successfully"

      - name: Check WorkManager dependency
        shell: bash
        run: |
          set -e

          GRADLE_FILE="${{ steps.project.outputs.dir }}/app/build.gradle"

          if ! grep -q "androidx.work:work-runtime" "$GRADLE_FILE"; then
            echo "ERROR: WorkManager dependency not found"
            exit 1
          fi

          echo "WorkManager dependency found successfully"

      - name: Check Guava dependency
        shell: bash
        run: |
          set -e

          GRADLE_FILE="${{ steps.project.outputs.dir }}/app/build.gradle"

          if ! grep -q "com.google.guava:guava" "$GRADLE_FILE"; then
            echo "ERROR: Guava dependency not found"
            exit 1
          fi

          echo "Guava dependency found successfully"

      - name: Show important Gradle dependencies
        shell: bash
        run: |
          set -e

          GRADLE_FILE="${{ steps.project.outputs.dir }}/app/build.gradle"

          echo "----- IMPORTANT DEPENDENCIES -----"

          grep "firebase" "$GRADLE_FILE" || true
          grep "work-runtime" "$GRADLE_FILE" || true
          grep "guava" "$GRADLE_FILE" || true
          grep "zxing" "$GRADLE_FILE" || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          gradle assembleDebug --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*debug*.apk' | head -1)"

          if [ -z "$APK" ]; then
            APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*.apk' | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found at: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          cp "${{ steps.apk.outputs.path }}" \
          "apk-output/Kayan-Vet-Hospital-V2.9.1-Firestore.apk"

          echo "Final APK prepared successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V2.9.1-Firestore-APK
          path: apk-output/Kayan-Vet-Hospital-V2.9.1-Firestore.apk
          if-no-files-found: error
          retention-days: 30

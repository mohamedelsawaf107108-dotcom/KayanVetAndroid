name: Build Kayan Vet V3.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan V3.5 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " INSTALLING ANDROID SDK 35"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK READY"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Kayan V3.5 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " SEARCHING FOR KAYAN V3.5 ZIP"
          echo "======================================"

          echo ""
          echo "Available ZIP files:"
          find . -type f -iname "*.zip" -print || true

          ZIP_FILE=""

          ZIP_FILE=$(find . -type f \
            -iname "*V3.5.0*MERGED*CLINICAL*.zip" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*V3.5*MERGED*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*V3.5*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*MERGED*CLINICAL*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*KayanVetAndroid*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Kayan V3.5 ZIP not found."
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Kayan Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " EXTRACTING KAYAN PROJECT"
          echo "======================================"

          rm -rf kayan-build
          mkdir -p kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo ""
          echo "EXTRACTION COMPLETED"

          echo ""
          echo "Extracted files:"
          find kayan-build -maxdepth 6 -type f | head -250

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS_FILE=$(find kayan-build \
            -type f \
            -name "settings.gradle" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find kayan-build \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle not found."
            echo ""
            echo "Extracted project contents:"
            find kayan-build -maxdepth 7 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          echo ""
          echo "local.properties:"
          cat "$PROJECT_DIR/local.properties"

      - name: Normalize Project Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " NORMALIZING PROJECT FILES"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.java" \
              -o -name "*.xml" \
              -o -name "*.properties" \
              -o -name "*.html" \
            \) \
            -exec sed -i 's/\r$//' {} \; || true

          echo ""
          echo "FILES NORMALIZED"

      - name: Fix MainActivity Java
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " FIXING MAINACTIVITY"
          echo "======================================"

          MAIN=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            | head -n 1 || true)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN"

          sed -i 's/\r$//' "$MAIN"

          sed -i \
            's/import android\.app\.PrintManager;/import android.print.PrintManager;/' \
            "$MAIN"

          sed -i \
            's/MainActivity\.super\.onBackPressed();/finish();/' \
            "$MAIN"

          echo ""
          echo "PrintManager check:"
          grep -n "PrintManager" "$MAIN" || true

          echo ""
          echo "MAINACTIVITY FIX COMPLETED"

      - name: Verify Merged Clinical Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " VERIFYING MERGED APP FILES"
          echo "======================================"

          ASSETS="$PROJECT_DIR/app/src/main/assets"

          mkdir -p "$ASSETS"

          echo ""
          echo "Current assets:"
          find "$ASSETS" -maxdepth 3 -type f -print || true

          if [ ! -f "$ASSETS/index.html" ]; then

            echo ""
            echo "index.html not in assets."
            echo "Searching project..."

            INDEX=$(find "$PROJECT_DIR" \
              -type f \
              -name "index.html" \
              | head -n 1 || true)

            if [ -n "$INDEX" ]; then

              echo "Found:"
              echo "$INDEX"

              cp "$INDEX" "$ASSETS/index.html"

              echo "index.html copied to Android assets."

            else

              echo "ERROR: index.html not found."
              exit 1

            fi
          fi

          echo ""
          echo "MAIN APP:"
          ls -lh "$ASSETS/index.html"

          if [ -f "$ASSETS/clinical.html" ]; then
            echo ""
            echo "CLINICAL ASSISTANT:"
            ls -lh "$ASSETS/clinical.html"
          else
            echo ""
            echo "clinical.html not found as separate file."
            echo "Clinical module may already be inside index.html."
          fi

          if [ -f "$ASSETS/computer_backup.json" ]; then
            echo ""
            echo "DATABASE:"
            ls -lh "$ASSETS/computer_backup.json"
          else
            echo ""
            echo "computer_backup.json not found as separate asset."
          fi

          echo ""
          echo "MERGED APP FILE CHECK COMPLETED"

      - name: Ensure Java 17 Compatibility
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BUILD_FILE" ]; then

            if ! grep -q "sourceCompatibility" "$BUILD_FILE"; then

              python3 - <<'PY'
          import os

          project = os.environ["PROJECT_DIR"]
          p = os.path.join(project, "app", "build.gradle")

          with open(p, "r", encoding="utf-8") as f:
              text = f.read()

          marker = "android {"

          options = """

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

          if marker in text:
              text = text.replace(
                  marker,
                  marker + options,
                  1
              )

              with open(p, "w", encoding="utf-8") as f:
                  f.write(text)

              print("Java 17 compileOptions added.")
          else:
              print("android block not found.")

          PY

            else
              echo "Java compatibility already configured."
            fi

          fi

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " VERIFYING ANDROID PROJECT"
          echo "======================================"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html missing."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo " PROJECT VERIFIED SUCCESSFULLY"
          echo "======================================"

      - name: Show Gradle Configuration
        shell: bash
        run: |
          echo "======================================"
          echo " ROOT BUILD.GRADLE"
          echo "======================================"

          cat "$PROJECT_DIR/build.gradle" 2>/dev/null || true

          echo ""
          echo "======================================"
          echo " APP BUILD.GRADLE"
          echo "======================================"

          cat "$PROJECT_DIR/app/build.gradle" 2>/dev/null || true

          echo ""
          echo "======================================"
          echo " SETTINGS.GRADLE"
          echo "======================================"

          cat "$PROJECT_DIR/settings.gradle" 2>/dev/null || true

      - name: Show Build Environment
        shell: bash
        run: |
          echo "======================================"
          echo " JAVA VERSION"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo " GRADLE VERSION"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo " ANDROID SDK"
          echo "======================================"

          echo "$ANDROID_HOME"

      - name: Build Kayan V3.5 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING KAYAN VET V3.5 APK"
          echo "======================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo " APK BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)

          fi

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p final-apk

          cp "$APK_FILE" \
            "final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk"

          echo ""
          echo "======================================"
          echo " FINAL APK READY"
          echo "======================================"

          ls -lh \
            "final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk"

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.5-Merged-Clinical-APK
          path: final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Vet V3.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Vet V3.5 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " INSTALLING ANDROID SDK"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find V3.5 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " SEARCHING FOR KAYAN V3.5 ZIP"
          echo "======================================"

          echo "Available ZIP files:"
          find . -type f -iname "*.zip" -print || true

          ZIP_FILE=""

          ZIP_FILE=$(find . -type f \
            -iname "*V3.5.0*MERGED*CLINICAL*.zip" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*V3.5*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*MERGED*CLINICAL*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*KayanVetAndroid*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kayan V3.5 ZIP not found"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Kayan V3.5
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " EXTRACTING KAYAN PROJECT"
          echo "======================================"

          rm -rf kayan-build
          mkdir -p kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo ""
          echo "Extraction completed"

          echo ""
          echo "Extracted files:"
          find kayan-build -maxdepth 5 -type f | head -200

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find kayan-build \
            -type f \
            -name "settings.gradle" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find kayan-build \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          echo "local.properties:"
          cat "$PROJECT_DIR/local.properties"

      - name: Verify Clinical Merge Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " CHECKING MERGED CLINICAL FILES"
          echo "======================================"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: Main hospital index.html missing"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/clinical.html" ]; then
            echo "ERROR: Clinical Assistant clinical.html missing"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/computer_backup.json" ]; then
            echo "ERROR: Hospital database backup missing"
            exit 1
          fi

          echo ""
          echo "Main Hospital App:"
          ls -lh "$PROJECT_DIR/app/src/main/assets/index.html"

          echo ""
          echo "Clinical Assistant:"
          ls -lh "$PROJECT_DIR/app/src/main/assets/clinical.html"

          echo ""
          echo "Hospital Database:"
          ls -lh "$PROJECT_DIR/app/src/main/assets/computer_backup.json"

          echo ""
          echo "MERGED FILES VERIFIED"

      - name: Fix Java Files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " FIXING JAVA FILES"
          echo "======================================"

          find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "*.java" \
            -exec sed -i 's/\r$//' {} \;

          find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "*.java" \
            -exec sed -i \
            's/import android\.app\.PrintManager;/import android.print.PrintManager;/' \
            {} \;

          echo ""
          echo "Java files repaired"

      - name: Repair Gradle Files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " REPAIRING GRADLE PROJECT"
          echo "======================================"

          find . \
            -type f \
            \( -name "*.gradle" \
            -o -name "*.java" \
            -o -name "*.xml" \) \
            -exec sed -i 's/\r$//' {} \; || true

          rm -f gradlew
          rm -f gradlew.bat

          echo ""
          echo "Using Gradle 8.9 installed by GitHub"

      - name: Ensure Java Compatibility
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ -f "$BUILD_FILE" ]; then

            if ! grep -q "sourceCompatibility" "$BUILD_FILE"; then

              python3 - <<'PY'
          import os

          p = os.environ["PROJECT_DIR"] + "/app/build.gradle"

          text = open(p, encoding="utf-8").read()

          marker = "android {"

          insert = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

          if marker in text:
              text = text.replace(
                  marker,
                  marker + insert,
                  1
              )

          open(p, "w", encoding="utf-8").write(text)
          PY

            fi

          fi

          echo ""
          echo "Java compatibility configured"

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " VERIFYING PROJECT"
          echo "======================================"

          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle missing"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html missing"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/clinical.html" ]; then
            echo "ERROR: clinical.html missing"
            exit 1
          fi

          echo ""
          echo "PROJECT VERIFIED SUCCESSFULLY"

      - name: Show Build Environment
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " JAVA"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo " GRADLE"
          echo "======================================"
          gradle --version

          echo ""
          echo "======================================"
          echo " ANDROID SDK"
          echo "======================================"
          echo "$ANDROID_HOME"

      - name: Build Kayan V3.5 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUILDING KAYAN VET V3.5"
          echo "======================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo " BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " SEARCHING FOR APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)

          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p final-apk

          cp "$APK_FILE" \
            final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk

          echo ""
          echo "======================================"
          echo " FINAL APK READY"
          echo "======================================"

          ls -lh \
            final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.5-Merged-Clinical-APK
          path: final-apk/Kayan-Vet-Hospital-V3.5-Merged-Clinical.apk
          if-no-files-found: error
          retention-days: 30

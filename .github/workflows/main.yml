name: Build Kayan Vet Firebase Final APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'KayanVetAndroid_V2_FIREBASE_FINAL.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "KayanVetAndroid_V2_FIREBASE_FINAL.zip" -d extracted

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          touch "$PROJECT_DIR/gradle.properties"

          grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties" \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT_DIR/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties" \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROJECT_DIR/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          echo "----- gradle.properties -----"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Check Firebase configuration
        shell: bash
        run: |
          set -e

          if [ ! -f "${{ steps.project.outputs.dir }}/app/google-services.json" ]; then
            echo "google-services.json not found"
            exit 1
          fi

          echo "Firebase configuration found"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*debug*.apk' | head -1)"

          if [ -z "$APK" ]; then
            APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*.apk' | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK found at: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          cp "${{ steps.apk.outputs.path }}" \
          "apk-output/Kayan-Vet-Hospital-Firebase-V2.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-Firebase-V2.2-APK
          path: apk-output/Kayan-Vet-Hospital-Firebase-V2.2.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Equine Clinical Assistant APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Kayan Equine APK

    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Download project
      # ==============================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # 2. Install Java 17
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # 3. Setup Gradle
      # ==============================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

        with:
          gradle-version: "8.9"


      # ==============================
      # 4. Check Android project
      # ==============================

      - name: Verify Kayan Project
        shell: bash

        run: |

          echo "=========================================="
          echo " KAYAN EQUINE CLINICAL ASSISTANT"
          echo " Android APK Build"
          echo "=========================================="

          echo ""
          echo "Checking project files..."
          echo ""

          ls -la

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if [ ! -f "app/src/main/assets/www/index.html" ]; then
            echo "ERROR: Kayan application index.html not found"
            exit 1
          fi

          echo ""
          echo "All required Kayan files found."
          echo ""


      # ==============================
      # 5. Clean project
      # ==============================

      - name: Clean Android Project
        run: |

          gradle clean


      # ==============================
      # 6. Build APK
      # ==============================

      - name: Build Kayan APK
        run: |

          gradle assembleDebug --stacktrace


      # ==============================
      # 7. Check generated APK
      # ==============================

      - name: Verify Generated APK
        shell: bash

        run: |

          echo ""
          echo "Searching for generated APK..."
          echo ""

          find app/build/outputs -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            echo ""

            exit 1

          fi

          echo ""
          echo "APK generated successfully."
          echo ""


      # ==============================
      # 8. Rename final APK
      # ==============================

      - name: Prepare Final Kayan APK
        shell: bash

        run: |

          mkdir -p apk-output

          cp app/build/outputs/apk/debug/app-debug.apk \
          apk-output/Kayan-Equine-Clinical-Assistant.apk

          echo ""
          echo "=========================================="
          echo " KAYAN EQUINE CLINICAL ASSISTANT"
          echo " APK READY"
          echo "=========================================="

          ls -lh apk-output/Kayan-Equine-Clinical-Assistant.apk


      # ==============================
      # 9. Upload APK
      # ==============================

      - name: Upload Kayan APK
        uses: actions/upload-artifact@v4

        with:

          name: Kayan-Equine-Clinical-Assistant-APK

          path: apk-output/Kayan-Equine-Clinical-Assistant.apk

          if-no-files-found: error

          retention-days: 30

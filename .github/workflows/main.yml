name: Build Kayan Vet V2 Roles APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'KayanVetAndroid_V2_ROLES_FIXED.zip'
      - 'KayanVetAndroid_V2_ROLES_FIXED (1).zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Kayan Vet V2 Roles
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "KayanVetAndroid_V2_ROLES_FIXED.zip" ]; then
            ZIP_FILE="KayanVetAndroid_V2_ROLES_FIXED.zip"
          elif [ -f "KayanVetAndroid_V2_ROLES_FIXED (1).zip" ]; then
            ZIP_FILE="KayanVetAndroid_V2_ROLES_FIXED (1).zip"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*ROLES_FIXED*.zip' | head -1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ROLES_FIXED ZIP not found"
            ls -lah
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Kayan Vet V2 Roles extracted successfully"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Kayan Vet V2 Roles APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*debug*.apk' | head -1)"

          if [ -z "$APK" ]; then
            APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*.apk' | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" "apk-output/Kayan-Vet-Hospital-V2-Roles.apk"

          echo "APK READY:"
          ls -lh apk-output/

      - name: Upload Kayan Vet V2 Roles APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V2-Roles-APK
          path: apk-output/Kayan-Vet-Hospital-V2-Roles.apk
          if-no-files-found: error
          retention-days: 30

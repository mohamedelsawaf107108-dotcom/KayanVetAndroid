name: Build Kayan Vet V3.3.0 Update Signed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V3.3.0 With Original V3.2.5 Signature
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # =========================================================
      # 4. Locate old signed V3.2.5 project
      # =========================================================
      - name: Find Original Signed V3.2.5 ZIP
        shell: bash
        run: |
          OLD_ZIP=$(find . -maxdepth 2 -type f \
            -name "*V3.2.5*SIGNING*.zip" \
            | head -n 1)

          if [ -z "$OLD_ZIP" ]; then
            OLD_ZIP=$(find . -maxdepth 2 -type f \
              -name "*V3.2.5*.zip" \
              | head -n 1)
          fi

          if [ -z "$OLD_ZIP" ]; then
            echo "ERROR: Original V3.2.5 signed project ZIP not found."
            exit 1
          fi

          echo "Original signed project:"
          echo "$OLD_ZIP"

          echo "OLD_ZIP=$OLD_ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 5. Locate new V3.3.0 project
      # =========================================================
      - name: Find New V3.3.0 ZIP
        shell: bash
        run: |
          NEW_ZIP=$(find . -maxdepth 2 -type f \
            -name "KayanVetAndroid_V3.3.0_GITHUB_ONE_CLICK_COMPLETE.zip" \
            | head -n 1)

          if [ -z "$NEW_ZIP" ]; then
            NEW_ZIP=$(find . -maxdepth 2 -type f \
              -name "*V3.3.0*ONE_CLICK*.zip" \
              | head -n 1)
          fi

          if [ -z "$NEW_ZIP" ]; then
            NEW_ZIP=$(find . -maxdepth 2 -type f \
              -name "*V3.3.0*.zip" \
              | grep -v "GITHUB_READY" \
              | head -n 1)
          fi

          if [ -z "$NEW_ZIP" ]; then
            echo "ERROR: V3.3.0 project ZIP not found."
            exit 1
          fi

          echo "New project:"
          echo "$NEW_ZIP"

          echo "NEW_ZIP=$NEW_ZIP" >> "$GITHUB_ENV"


      # =========================================================
      # 6. Extract both projects
      # =========================================================
      - name: Extract Old And New Projects
        shell: bash
        run: |
          rm -rf old_project
          rm -rf new_project

          mkdir -p old_project
          mkdir -p new_project

          unzip -q "$OLD_ZIP" -d old_project
          unzip -q "$NEW_ZIP" -d new_project

          echo "Both projects extracted."


      # =========================================================
      # 7. Locate project directories
      # =========================================================
      - name: Locate Android Projects
        shell: bash
        run: |
          OLD_SETTINGS=$(find old_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          NEW_SETTINGS=$(find new_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$OLD_SETTINGS" ]; then
            echo "ERROR: Old Android project not found."
            exit 1
          fi

          if [ -z "$NEW_SETTINGS" ]; then
            echo "ERROR: New Android project not found."
            exit 1
          fi

          OLD_PROJECT_DIR=$(dirname "$OLD_SETTINGS")
          NEW_PROJECT_DIR=$(dirname "$NEW_SETTINGS")

          echo "Old project:"
          echo "$OLD_PROJECT_DIR"

          echo "New project:"
          echo "$NEW_PROJECT_DIR"

          echo "OLD_PROJECT_DIR=$OLD_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "NEW_PROJECT_DIR=$NEW_PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 8. Find original signing keystore
      # =========================================================
      - name: Find Original Signing Keystore
        shell: bash
        run: |
          KEYSTORE_PATH=$(find "$OLD_PROJECT_DIR" \
            -type f \
            \( -iname "*.jks" -o -iname "*.keystore" \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then
            echo "ERROR: Original signing keystore not found."
            echo ""
            echo "Old project files:"
            find "$OLD_PROJECT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          echo "Original signing keystore found:"
          echo "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"


      # =========================================================
      # 9. Read original signing configuration
      # =========================================================
      - name: Read Original Signing Configuration
        shell: bash
        run: |
          OLD_GRADLE="$OLD_PROJECT_DIR/app/build.gradle"

          if [ ! -f "$OLD_GRADLE" ]; then
            echo "ERROR: Old app/build.gradle not found."
            exit 1
          fi

          STORE_PASSWORD=$(grep -E "storePassword" "$OLD_GRADLE" \
            | head -n 1 \
            | sed -E "s/.*storePassword[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")

          KEY_ALIAS=$(grep -E "keyAlias" "$OLD_GRADLE" \
            | head -n 1 \
            | sed -E "s/.*keyAlias[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")

          KEY_PASSWORD=$(grep -E "keyPassword" "$OLD_GRADLE" \
            | head -n 1 \
            | sed -E "s/.*keyPassword[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: Could not read storePassword from old project."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Could not read keyAlias from old project."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Could not read keyPassword from old project."
            exit 1
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Original signing information loaded."


      # =========================================================
      # 10. Copy old keystore into V3.3.0
      # =========================================================
      - name: Copy Original Keystore To V3.3.0
        shell: bash
        run: |
          cp "$KEYSTORE_PATH" \
            "$NEW_PROJECT_DIR/app/kayan-original-release.jks"

          echo "Original keystore copied successfully."


      # =========================================================
      # 11. Create keystore.properties
      # =========================================================
      - name: Create Signing Properties
        shell: bash
        run: |
          cat > "$NEW_PROJECT_DIR/keystore.properties" <<EOF
          storeFile=kayan-original-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Signing properties created."


      # =========================================================
      # 12. Ensure V3.3 build.gradle uses original signing
      # =========================================================
      - name: Configure Release Signing
        shell: bash
        run: |
          APP_GRADLE="$NEW_PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: New app/build.gradle not found."
            exit 1
          fi

          echo "Checking signing configuration..."

          cat "$APP_GRADLE"


      # =========================================================
      # 13. Fix Gradle wrapper Windows CRLF
      # =========================================================
      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          cd "$NEW_PROJECT_DIR"

          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi


      # =========================================================
      # 14. Determine Gradle command
      # =========================================================
      - name: Select Gradle Command
        shell: bash
        run: |
          cd "$NEW_PROJECT_DIR"

          if [ -f gradlew ]; then

            if ./gradlew --version; then
              echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
            else
              echo "Wrapper failed. Using installed Gradle."
              gradle --version
              echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
            fi

          else

            gradle --version
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"

          fi


      # =========================================================
      # 15. Verify signing key
      # =========================================================
      - name: Verify Original Signing Key
        shell: bash
        run: |
          keytool -list \
            -keystore "$NEW_PROJECT_DIR/app/kayan-original-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Original signing key verified successfully."


      # =========================================================
      # 16. Clean
      # =========================================================
      - name: Clean V3.3.0
        shell: bash
        run: |
          cd "$NEW_PROJECT_DIR"
          $GRADLE_COMMAND clean --stacktrace


      # =========================================================
      # 17. Build RELEASE, not Debug
      # =========================================================
      - name: Build Signed V3.3.0 Release APK
        shell: bash
        run: |
          cd "$NEW_PROJECT_DIR"

          $GRADLE_COMMAND assembleRelease --stacktrace


      # =========================================================
      # 18. Find release APK
      # =========================================================
      - name: Find Signed Release APK
        shell: bash
        run: |
          APK_PATH=$(find "$NEW_PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed release APK not found."
            echo ""
            find "$NEW_PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "Signed APK:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # =========================================================
      # 19. Prepare final update APK
      # =========================================================
      - name: Prepare Update APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
            "apk-output/Kayan-Vet-Hospital-V3.3.0-UPDATE-SIGNED.apk"

          ls -lh apk-output


      # =========================================================
      # 20. Upload
      # =========================================================
      - name: Upload V3.3.0 Update APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.3.0-UPDATE-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.3.0-UPDATE-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

name: Build Kayan Vet Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'KayanVetAndroid_MOBILE_HTML_FIXED.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract mobile Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "KayanVetAndroid_MOBILE_HTML_FIXED.zip" -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found inside ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.project.outputs.dir }}" -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK generated at: $APK"
          mkdir -p apk-output
          cp "$APK" "apk-output/Kayan-Vet-Hospital.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-APK
          path: apk-output/Kayan-Vet-Hospital.apk
          if-no-files-found: error
          retention-days: 30

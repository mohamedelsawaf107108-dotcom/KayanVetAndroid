name: Build Kayan Vet V3.3.0 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kayan Vet Android
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1) Download repository files
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2) Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3) Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================
      # 4) Make Gradle executable
      # ==========================================
      - name: Make Gradle Executable
        run: chmod +x ./gradlew


      # ==========================================
      # 5) Restore Firebase google-services.json
      # ==========================================
      - name: Create Google Services File
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json


      # ==========================================
      # 6) Restore signing keystore
      # ==========================================
      - name: Create Signing Keystore
        env:
          KAYAN_KEYSTORE_BASE64: ${{ secrets.KAYAN_KEYSTORE_BASE64 }}
        run: |
          echo "$KAYAN_KEYSTORE_BASE64" | base64 --decode > app/kayan-upload.jks


      # ==========================================
      # 7) Create keystore.properties
      # ==========================================
      - name: Create Keystore Properties
        env:
          STORE_PASSWORD: ${{ secrets.KAYAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAYAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAYAN_KEY_PASSWORD }}
        run: |
          echo "storeFile=kayan-upload.jks" > keystore.properties
          echo "storePassword=$STORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties


      # ==========================================
      # 8) Clean old build
      # ==========================================
      - name: Clean Project
        run: ./gradlew clean


      # ==========================================
      # 9) Build Signed Release APK
      # ==========================================
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace


      # ==========================================
      # 10) Create output folder
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk \
          apk-output/Kayan-Vet-Hospital-V3.3.0-SIGNED.apk


      # ==========================================
      # 11) Upload APK
      # ==========================================
      - name: Upload Kayan Vet APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.3.0
          path: apk-output/Kayan-Vet-Hospital-V3.3.0-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

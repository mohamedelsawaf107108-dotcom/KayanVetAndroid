name: Build My Life V2.5 Premium Focus 60-30

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V2.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find And Extract My Life V2.5 ZIP
        shell: bash
        run: |
          echo "Searching for My Life V2.5 project..."

          ZIP_PATH=$(find . -maxdepth 5 -type f \
            \( \
              -iname "*MyLife*V2.5*.zip" \
              -o -iname "*My-Life*V2.5*.zip" \
              -o -iname "*FOCUS*60*30*.zip" \
            \) | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "Exact V2.5 ZIP not found. Searching for MyLife ZIP..."
            ZIP_PATH=$(find . -maxdepth 5 -type f \
              \( -iname "*MyLife*.zip" -o -iname "*My-Life*.zip" \) \
              | sort | tail -n 1)
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: My Life project ZIP not found."
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_PATH"

          rm -rf "$GITHUB_WORKSPACE/mylife_build"
          mkdir -p "$GITHUB_WORKSPACE/mylife_build"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/mylife_build"

          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            find "$GITHUB_WORKSPACE/mylife_build" -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

      - name: Verify Android Project
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project structure OK"

      - name: Verify Package And Version
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q "applicationId 'com.mylife.app'" "$BUILD_FILE"
          grep -q "versionCode 16" "$BUILD_FILE"
          grep -q "versionName '2.5.0'" "$BUILD_FILE"

          echo "Package: com.mylife.app"
          echo "Version: 2.5.0"
          echo "Version Code: 16"

      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( -iname "*.jks" -o -iname "*.keystore" \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then
            echo "ERROR: Permanent signing key not found."
            exit 1
          fi

          echo "Permanent signing key found:"
          echo "$KEYSTORE_PATH"

      - name: Verify Focus 60-30 System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Focus 60/30 system..."

          if grep -q "60" "$INDEX_FILE"; then
            echo "60-minute focus configuration detected"
          fi

          if grep -q "30" "$INDEX_FILE"; then
            echo "30-minute break configuration detected"
          fi

          if grep -qi "focus" "$INDEX_FILE"; then
            echo "Focus system detected"
          fi

          echo "Focus verification finished"

      - name: Verify Five Life Pillars
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "روحي" "$INDEX_FILE" || true
          grep -q "صحي" "$INDEX_FILE" || true
          grep -q "شخصي" "$INDEX_FILE" || true
          grep -q "مهني" "$INDEX_FILE" || true
          grep -q "مادي" "$INDEX_FILE" || true

          echo "Five Life Pillars checked"

      - name: Verify Step Counter
        shell: bash
        run: |
          JAVA_DIR="$PROJECT_DIR/app/src/main/java"

          if grep -R -q "TYPE_STEP_COUNTER" "$JAVA_DIR"; then
            echo "Native Step Counter found"
          else
            echo "ERROR: TYPE_STEP_COUNTER missing"
            exit 1
          fi

      - name: Verify Activity Recognition Permission
        shell: bash
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if grep -q "ACTIVITY_RECOGNITION" "$MANIFEST"; then
            echo "Activity Recognition permission found"
          else
            echo "ERROR: ACTIVITY_RECOGNITION missing"
            exit 1
          fi

      - name: Verify Health And Weight System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "weightHistory" "$INDEX_FILE" \
            && echo "Weight history found" \
            || true

          grep -q "targetWeight" "$INDEX_FILE" \
            && echo "Target weight found" \
            || true

          grep -q "BMI" "$INDEX_FILE" \
            && echo "BMI found" \
            || true

          grep -q "تسجيل الوزن" "$INDEX_FILE" \
            && echo "Daily weight logging found" \
            || true

      - name: Verify Calendar History
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "كل المحفوظ" "$INDEX_FILE" \
            && echo "Complete calendar history found" \
            || true

      - name: Verify Quran And Adhkar
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "القرآن" "$INDEX_FILE" \
            && echo "Quran found" \
            || true

          grep -q "أذكار الصباح" "$INDEX_FILE" \
            && echo "Morning Adhkar found" \
            || true

          grep -q "أذكار المساء" "$INDEX_FILE" \
            && echo "Evening Adhkar found" \
            || true

      - name: Build Signed Release APK
        shell: bash
        run: |
          echo "========================================"
          echo "BUILDING MY LIFE V2.5"
          echo "PREMIUM FOCUS 60/30"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true

            bash ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          else
            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          fi

      - name: Find Signed Release APK
        shell: bash
        run: |
          APK_PATH=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null | sort || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "SIGNED APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/My-Life-V2.5-PREMIUM-FOCUS-60-30.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo "Final APK:"
          ls -lh "$FINAL_APK"

      - name: Final Build Information
        shell: bash
        run: |
          echo "=========================================="
          echo "MY LIFE V2.5 BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Package: com.mylife.app"
          echo "Version: 2.5.0"
          echo "Version Code: 16"
          echo ""
          echo "PREMIUM HOME"
          echo "- Clean dashboard"
          echo "- Five visible Life Pillars"
          echo "- Spiritual"
          echo "- Health"
          echo "- Personal"
          echo "- Professional"
          echo "- Financial"
          echo ""
          echo "FOCUS"
          echo "- 60 minutes achievement"
          echo "- 30 minutes break"
          echo "- Live countdown"
          echo "- Start / Pause"
          echo "- Automatic cycles"
          echo "- Focus sessions"
          echo "- Break sessions"
          echo "- Achievement minutes"
          echo "- XP"
          echo ""
          echo "HEALTH"
          echo "- Daily weight logging"
          echo "- Target weight"
          echo "- Weight history"
          echo "- Weekly chart"
          echo "- BMI"
          echo "- Step counter"
          echo "- Kilometers"
          echo "- Calories"
          echo ""
          echo "CALENDAR"
          echo "- Past events"
          echo "- Today"
          echo "- Future events"
          echo "- Reminders"
          echo ""
          echo "SPIRITUAL"
          echo "- Prayer times"
          echo "- Quran"
          echo "- Wird"
          echo "- Morning Adhkar"
          echo "- Evening Adhkar"
          echo ""
          echo "APK READY"

      - name: Upload My Life V2.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V2.5-PREMIUM-FOCUS-60-30
          path: apk-output/My-Life-V2.5-PREMIUM-FOCUS-60-30.apk
          if-no-files-found: error
          retention-days: 30

name: Build My Life V2.1 Health Progress

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V2.1
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================================
      # INSTALL ANDROID SDK 35
      # ==========================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 ready"


      # ==========================================================
      # GRADLE 8.9
      # ==========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================================
      # FIND V2.1 ZIP
      # ==========================================================
      - name: Find My Life V2.1 ZIP
        shell: bash
        run: |
          echo "========================================"
          echo "Searching for My Life V2.1 ZIP"
          echo "========================================"

          ZIP_PATH=$(find . \
            -maxdepth 4 \
            -type f \
            \( \
              -iname "*MyLife*V2.1*.zip" \
              -o -iname "*My-Life*V2.1*.zip" \
              -o -iname "*WEIGHT*GOAL*WEEKLY*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then

            echo "Exact V2.1 ZIP not found."
            echo "Searching for latest My Life ZIP..."

            ZIP_PATH=$(find . \
              -maxdepth 4 \
              -type f \
              \( \
                -iname "*MyLife*.zip" \
                -o -iname "*My-Life*.zip" \
              \) \
              | sort \
              | tail -n 1)

          fi

          if [ -z "$ZIP_PATH" ]; then

            echo ""
            echo "ERROR: My Life ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort

            exit 1

          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # EXTRACT PROJECT
      # ==========================================================
      - name: Extract My Life V2.1
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/mylife_build"

          mkdir -p "$GITHUB_WORKSPACE/mylife_build"

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/mylife_build"

          echo "Extraction completed"


      # ==========================================================
      # FIND ANDROID PROJECT
      # ==========================================================
      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then

            echo "ERROR: settings.gradle not found."

            find "$GITHUB_WORKSPACE/mylife_build" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================================
      # VERIFY PROJECT
      # ==========================================================
      - name: Verify Android Project
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"

          test -f \
            "$PROJECT_DIR/app/build.gradle"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verified"


      # ==========================================================
      # VERIFY PACKAGE
      # ==========================================================
      - name: Verify Permanent Package
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "applicationId 'com.mylife.app'" \
            "$BUILD_FILE"

          echo ""
          echo "Package verified:"
          echo "com.mylife.app"


      # ==========================================================
      # VERIFY VERSION
      # ==========================================================
      - name: Verify My Life V2.1 Version
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "versionCode 12" \
            "$BUILD_FILE"

          grep -q \
            "versionName '2.1.0'" \
            "$BUILD_FILE"

          echo ""
          echo "Version verified:"
          echo "My Life 2.1.0"
          echo "versionCode 12"


      # ==========================================================
      # VERIFY WEIGHT GOAL FEATURE
      # ==========================================================
      - name: Verify Weight Goal
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking weight goal feature..."

          if grep -q "الوزن المستهدف" "$INDEX_FILE"; then
            echo "Weight target feature found"
          else
            echo "WARNING: Weight target Arabic label not found"
          fi

          if grep -q "targetWeight" "$INDEX_FILE"; then
            echo "Target weight logic found"
          else
            echo "WARNING: targetWeight variable not detected"
          fi

          echo "Weight goal verification completed"


      # ==========================================================
      # VERIFY WEIGHT HISTORY
      # ==========================================================
      - name: Verify Weight History
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking weight history..."

          if grep -q "weightHistory" "$INDEX_FILE"; then
            echo "Weight history found"
          else
            echo "WARNING: Weight history variable not detected"
          fi

          echo "Weight history verification completed"


      # ==========================================================
      # VERIFY WEEKLY PROGRESS
      # ==========================================================
      - name: Verify Weekly Weight Progress
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking weekly progress..."

          if grep -q "weekly" "$INDEX_FILE"; then
            echo "Weekly progress logic found"
          else
            echo "WARNING: Weekly progress keyword not detected"
          fi

          echo "Weekly weight progress verification completed"


      # ==========================================================
      # VERIFY STEP COUNTER
      # ==========================================================
      - name: Verify Step Counter
        shell: bash
        run: |
          JAVA_DIR="$PROJECT_DIR/app/src/main/java"

          echo "Checking Android step sensor..."

          if grep -R -q \
            "TYPE_STEP_COUNTER" \
            "$JAVA_DIR"; then

            echo "Android TYPE_STEP_COUNTER found"

          else

            echo "ERROR: Android step counter missing"
            exit 1

          fi


      # ==========================================================
      # VERIFY ACTIVITY RECOGNITION PERMISSION
      # ==========================================================
      - name: Verify Physical Activity Permission
        shell: bash
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if grep -q \
            "ACTIVITY_RECOGNITION" \
            "$MANIFEST"; then

            echo "ACTIVITY_RECOGNITION permission found"

          else

            echo "ERROR: ACTIVITY_RECOGNITION permission missing"
            exit 1

          fi


      # ==========================================================
      # VERIFY HEALTH FEATURES
      # ==========================================================
      - name: Verify Health Features
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking health dashboard..."

          if grep -q "BMI" "$INDEX_FILE"; then
            echo "BMI feature found"
          else
            echo "WARNING: BMI label not detected"
          fi

          if grep -q "كم" "$INDEX_FILE"; then
            echo "Distance feature found"
          else
            echo "WARNING: Distance label not detected"
          fi

          if grep -q "سعر" "$INDEX_FILE"; then
            echo "Calories feature found"
          else
            echo "WARNING: Calories label not detected"
          fi

          echo ""
          echo "Health feature verification completed"


      # ==========================================================
      # VERIFY CALENDAR HISTORY
      # ==========================================================
      - name: Verify Calendar Old And New Events
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if grep -q "كل المحفوظ" "$INDEX_FILE"; then

            echo "Calendar full history found"

          else

            echo "WARNING: Calendar full-history label not detected"

          fi

          echo "Calendar verification completed"


      # ==========================================================
      # VERIFY ADHKAR
      # ==========================================================
      - name: Verify Adhkar
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if grep -q "أذكار الصباح" "$INDEX_FILE"; then
            echo "Morning Adhkar found"
          else
            echo "WARNING: Morning Adhkar label not detected"
          fi

          if grep -q "أذكار المساء" "$INDEX_FILE"; then
            echo "Evening Adhkar found"
          else
            echo "WARNING: Evening Adhkar label not detected"
          fi

          echo "Adhkar verification completed"


      # ==========================================================
      # VERIFY PERMANENT SIGNING KEY
      # ==========================================================
      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          echo "Searching for permanent signing key..."

          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -iname "*.jks" \
              -o -iname "*.keystore" \
            \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then

            echo ""
            echo "ERROR: Permanent signing key not found"
            echo "Cannot build a safe update APK"

            exit 1

          fi

          echo ""
          echo "Permanent signing key found:"
          echo "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # BUILD SIGNED RELEASE APK
      # ==========================================================
      - name: Build Signed Release APK
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILDING MY LIFE V2.1"
          echo "========================================"
          echo ""

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Using Gradle Wrapper"

            chmod +x ./gradlew || true

            bash ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          else

            echo "Using Gradle 8.9"

            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          fi

          echo ""
          echo "Gradle build completed"


      # ==========================================================
      # FIND SIGNED RELEASE APK
      # ==========================================================
      - name: Find Signed Release APK
        shell: bash
        run: |
          echo "Searching for signed APK..."

          APK_PATH=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then

            echo ""
            echo "ERROR: Signed release APK not found"
            echo ""

            find \
              "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1

          fi

          echo ""
          echo "SIGNED APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ==========================================================
      # VERIFY GENERATED APK
      # ==========================================================
      - name: Verify Generated APK
        shell: bash
        run: |
          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK file missing"
            exit 1

          fi

          echo ""
          echo "Generated APK verified"

          ls -lh "$APK_PATH"


      # ==========================================================
      # APK INFORMATION
      # ==========================================================
      - name: Show APK Information
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          AAPT_PATH=$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aapt" \
            2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -n "$AAPT_PATH" ]; then

            echo ""
            echo "APK INFORMATION:"
            echo ""

            "$AAPT_PATH" dump badging "$APK_PATH" \
              | grep -E \
                "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:" \
              || true

          else

            echo "AAPT not found - skipping package display"

          fi


      # ==========================================================
      # PREPARE FINAL APK
      # ==========================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/My-Life-V2.1-HEALTH-PROGRESS.apk"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo ""
          echo "FINAL APK:"
          echo "$FINAL_APK"

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # ==========================================================
      # FINAL VERIFICATION
      # ==========================================================
      - name: Final Verification
        shell: bash
        run: |
          test -f "$FINAL_APK"

          echo ""
          echo "========================================"
          echo "MY LIFE V2.1 BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Package:"
          echo "com.mylife.app"
          echo ""
          echo "Version:"
          echo "2.1.0"
          echo ""
          echo "Version Code:"
          echo "12"
          echo ""
          echo "HEALTH FEATURES:"
          echo "- Current weight"
          echo "- Height"
          echo "- BMI"
          echo "- Healthy weight range"
          echo "- Custom target weight"
          echo "- Remaining kilograms"
          echo "- Goal completion percentage"
          echo "- Weight history"
          echo "- Weekly weight chart"
          echo "- Step counter"
          echo "- Distance"
          echo "- Calories burned"
          echo "- Food calorie equivalents"
          echo ""
          echo "OTHER FEATURES:"
          echo "- Full Calendar history"
          echo "- Old + current + future events"
          echo "- Adhkar"
          echo "- Quran"
          echo "- Permanent signing key"
          echo ""
          echo "APK READY"


      # ==========================================================
      # UPLOAD FINAL APK
      # ==========================================================
      - name: Upload My Life V2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V2.1-HEALTH-PROGRESS
          path: apk-output/My-Life-V2.1-HEALTH-PROGRESS.apk
          if-no-files-found: error
          retention-days: 30

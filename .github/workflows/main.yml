name: Build Kayan Equine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Kayan Equine APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " INSTALLING ANDROID SDK"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."


      # ==========================================
      # 4. GRADLE
      # ==========================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # 5. FIND KAYAN ZIP AUTOMATICALLY
      # ==========================================

      - name: Find Kayan ZIP
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo " SEARCHING FOR KAYAN PROJECT"
          echo "======================================"
          echo ""

          echo "ZIP files in repository:"
          find . -type f -iname "*.zip" -print || true

          ZIP_FILE=""

          ZIP_FILE=$(find . -type f \
            -iname "*Kayan*Equine*Clinical*Assistant*FIXED*.zip" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*Equine*Clinical*Assistant*CLEAN*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*Equine*Clinical*Assistant*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f \
              -iname "*Kayan*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: Kayan ZIP not found."
            echo ""

            exit 1

          fi

          echo ""
          echo "Kayan ZIP FOUND:"
          echo "$ZIP_FILE"
          echo ""

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. EXTRACT PROJECT AUTOMATICALLY
      # ==========================================

      - name: Extract Kayan Project
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo " EXTRACTING KAYAN PROJECT"
          echo "======================================"

          rm -rf kayan-build

          mkdir -p kayan-build

          unzip -q "$ZIP_FILE" -d kayan-build

          echo ""
          echo "Extraction completed."
          echo ""

          find kayan-build -maxdepth 5 -type f | head -200


      # ==========================================
      # 7. FIND ANDROID PROJECT AUTOMATICALLY
      # ==========================================

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo ""
          echo "Searching for settings.gradle..."
          echo ""

          SETTINGS_FILE=$(find kayan-build \
            -type f \
            -name "settings.gradle" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then

            SETTINGS_FILE=$(find kayan-build \
              -type f \
              -name "settings.gradle.kts" \
              | head -n 1 || true)

          fi

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR: Android project not found."
            echo "settings.gradle missing."

            exit 1

          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. PREPARE INDEX.HTML
      # ==========================================

      - name: Prepare Kayan Application
        shell: bash
        run: |
          set -e

          TARGET_DIR="$PROJECT_DIR/app/src/main/assets/www"

          mkdir -p "$TARGET_DIR"

          if [ -f "$TARGET_DIR/index.html" ]; then

            echo ""
            echo "Kayan index.html already ready."

          else

            echo ""
            echo "Searching for index.html..."

            INDEX_FILE=$(find kayan-build \
              -type f \
              -iname "index.html" \
              | head -n 1 || true)

            if [ -z "$INDEX_FILE" ]; then

              INDEX_FILE=$(find . \
                -type f \
                -iname "index.html" \
                ! -path "./kayan-build/*" \
                | head -n 1 || true)

            fi

            if [ -z "$INDEX_FILE" ]; then

              echo "ERROR: index.html not found."

              exit 1

            fi

            echo ""
            echo "index.html found:"
            echo "$INDEX_FILE"

            cp "$INDEX_FILE" \
              "$TARGET_DIR/index.html"

          fi

          echo ""
          echo "Application file:"
          ls -lh "$TARGET_DIR/index.html"


      # ==========================================
      # 9. CONFIGURE ANDROID
      # ==========================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          echo "Android SDK configured:"
          cat "$PROJECT_DIR/local.properties"


      # ==========================================
      # 10. FIX PROJECT FILES
      # ==========================================

      - name: Repair Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " REPAIRING PROJECT"
          echo "======================================"

          # Remove Windows CRLF where applicable

          find . \
            -type f \
            \( -name "*.gradle" \
            -o -name "*.java" \
            -o -name "*.xml" \) \
            -exec sed -i 's/\r$//' {} \; || true

          # The project had an old/broken Gradle wrapper.
          # GitHub's installed Gradle 8.9 is used instead.

          rm -f gradlew
          rm -f gradlew.bat

          echo ""
          echo "Project repaired."


      # ==========================================
      # 11. VERIFY ALL REQUIRED FILES
      # ==========================================

      - name: Verify Kayan Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " VERIFYING KAYAN EQUINE APP"
          echo "======================================"
          echo ""

          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle missing"
            exit 1

          fi


          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then

            echo "ERROR: root build.gradle missing"
            exit 1

          fi


          if [ ! -d "app" ]; then

            echo "ERROR: app folder missing"
            exit 1

          fi


          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then

            echo "ERROR: app/build.gradle missing"
            exit 1

          fi


          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml missing"
            exit 1

          fi


          if [ ! -f "app/src/main/assets/www/index.html" ]; then

            echo "ERROR: Kayan index.html missing"
            exit 1

          fi


          if [ ! -f \
            "app/src/main/java/com/kayan/equine/MainActivity.java" ]; then

            echo "ERROR: MainActivity.java missing"
            exit 1

          fi


          echo ""
          echo "======================================"
          echo " PROJECT VERIFIED SUCCESSFULLY"
          echo "======================================"


      # ==========================================
      # 12. SHOW BUILD ENVIRONMENT
      # ==========================================

      - name: Check Build Environment
        shell: bash
        run: |
          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          echo ""
          echo "ANDROID SDK:"
          echo "$ANDROID_HOME"


      # ==========================================
      # 13. BUILD APK
      # ==========================================

      - name: Build Kayan APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo " KAYAN EQUINE CLINICAL ASSISTANT"
          echo " BUILDING ANDROID APK"
          echo "======================================"
          echo ""

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo " GRADLE BUILD COMPLETED"
          echo "======================================"


      # ==========================================
      # 14. FIND GENERATED APK
      # ==========================================

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "Searching for generated APK..."
          echo ""

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)

          fi

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            echo ""

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"


          mkdir -p final-apk


          cp "$APK_FILE" \
            final-apk/Kayan-Equine-Clinical-Assistant.apk


          echo ""
          echo "======================================"
          echo " KAYAN EQUINE APK READY"
          echo "======================================"
          echo ""

          ls -lh \
            final-apk/Kayan-Equine-Clinical-Assistant.apk


      # ==========================================
      # 15. UPLOAD APK FOR DOWNLOAD
      # ==========================================

      - name: Upload Kayan APK
        uses: actions/upload-artifact@v4
        with:

          name: Kayan-Equine-Clinical-Assistant-APK

          path: final-apk/Kayan-Equine-Clinical-Assistant.apk

          if-no-files-found: error

          retention-days: 30

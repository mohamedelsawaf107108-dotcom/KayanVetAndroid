name: Build Kayan Vet Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk \
          apk-output/Kayan-Vet-Hospital-V3.0.1-SIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.0.1-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

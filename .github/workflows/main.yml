name: Build My Life V1.9 Calendar History + Steps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V1.9
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================================
      # FIND V1.9 ZIP
      # ==========================================================

      - name: Find My Life V1.9 ZIP
        shell: bash
        run: |
          echo "Searching for My Life V1.9 ZIP..."

          ZIP_PATH=$(find . \
            -maxdepth 4 \
            -type f \
            \( \
              -iname "*MyLife*V1.9*.zip" \
              -o -iname "*My-Life*V1.9*.zip" \
              -o -iname "*CALENDAR*STEPS*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "Exact V1.9 ZIP not found."
            echo "Searching for MyLife ZIP..."

            ZIP_PATH=$(find . \
              -maxdepth 4 \
              -type f \
              \( \
                -iname "*MyLife*.zip" \
                -o -iname "*My-Life*.zip" \
              \) \
              | sort \
              | tail -n 1)
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: My Life ZIP not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # EXTRACT PROJECT
      # ==========================================================

      - name: Extract My Life V1.9
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/mylife_build"
          mkdir -p "$GITHUB_WORKSPACE/mylife_build"

          unzip -q \
            "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/mylife_build"

          echo "Extraction completed."

      # ==========================================================
      # FIND ANDROID PROJECT
      # ==========================================================

      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            find "$GITHUB_WORKSPACE/mylife_build" \
              -maxdepth 7 \
              -type f \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # VERIFY PROJECT
      # ==========================================================

      - name: Verify Android Project
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verified."

      # ==========================================================
      # VERIFY PACKAGE
      # ==========================================================

      - name: Verify Permanent Package
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "applicationId 'com.mylife.app'" \
            "$BUILD_FILE"

          echo "Package verified:"
          echo "com.mylife.app"

      # ==========================================================
      # VERIFY VERSION
      # ==========================================================

      - name: Verify V1.9 Version
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q \
            "versionCode 10" \
            "$BUILD_FILE"

          grep -q \
            "versionName '1.9.0'" \
            "$BUILD_FILE"

          echo "Version verified:"
          echo "My Life V1.9.0"
          echo "versionCode 10"

      # ==========================================================
      # VERIFY CALENDAR HISTORY
      # ==========================================================

      - name: Verify Calendar History Feature
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking calendar history..."

          if grep -q "كل المحفوظ" "$INDEX_FILE"; then
            echo "Calendar history section found."
          else
            echo "ERROR: Calendar history section missing."
            exit 1
          fi

          if grep -q "قديم" "$INDEX_FILE"; then
            echo "Past calendar status found."
          else
            echo "ERROR: Past calendar status missing."
            exit 1
          fi

          echo "Old + current + future calendar support verified."

      # ==========================================================
      # VERIFY STEP COUNTER
      # ==========================================================

      - name: Verify Step Counter
        shell: bash
        run: |
          echo "Checking step counter implementation..."

          JAVA_DIR="$PROJECT_DIR/app/src/main/java"

          if grep -R -q "TYPE_STEP_COUNTER" "$JAVA_DIR"; then
            echo "Android step sensor found."
          else
            echo "ERROR: TYPE_STEP_COUNTER not found."
            exit 1
          fi

          if grep -R -q "ACTIVITY_RECOGNITION" \
            "$PROJECT_DIR/app/src/main"; then
            echo "Physical Activity permission found."
          else
            echo "ERROR: ACTIVITY_RECOGNITION permission missing."
            exit 1
          fi

          echo "Step counter verified."

      # ==========================================================
      # VERIFY DISTANCE + CALORIES
      # ==========================================================

      - name: Verify Fitness Calculations
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking fitness calculations..."

          if grep -q "كيلومتر" "$INDEX_FILE"; then
            echo "Distance calculation UI found."
          else
            echo "ERROR: Kilometer display missing."
            exit 1
          fi

          if grep -q "سعر" "$INDEX_FILE"; then
            echo "Calories UI found."
          else
            echo "ERROR: Calories display missing."
            exit 1
          fi

          echo "Fitness calculations verified."

      # ==========================================================
      # VERIFY PERMANENT KEYSTORE
      # ==========================================================

      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -iname "*.jks" \
              -o -iname "*.keystore" \
            \) \
            | head -n 1)

          if [ -z "$KEYSTORE_PATH" ]; then
            echo "ERROR: Permanent signing key not found."
            exit 1
          fi

          echo "Permanent signing key found:"
          echo "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # BUILD RELEASE APK
      # ==========================================================

      - name: Build Signed Release APK
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING MY LIFE V1.9"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew || true

            bash ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          else

            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon

          fi

          echo "Build completed."

      # ==========================================================
      # FIND APK
      # ==========================================================

      - name: Find Signed Release APK
        shell: bash
        run: |
          APK_PATH=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then

            echo "Signed APK not found."
            echo "Searching release directory..."

            find \
              "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # SHOW APK PACKAGE
      # ==========================================================

      - name: Check APK Package
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          AAPT_PATH=$(find "$SDK_ROOT/build-tools" \
            -type f \
            -name "aapt" \
            2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -n "$AAPT_PATH" ]; then

            echo "APK INFORMATION:"

            "$AAPT_PATH" dump badging "$APK_PATH" \
              | grep -E \
                "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:" \
              || true

          fi

      # ==========================================================
      # PREPARE FINAL APK
      # ==========================================================

      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/My-Life-V1.9-CALENDAR-STEPS-UPDATE.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL APK:"
          echo "$FINAL_APK"

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

      # ==========================================================
      # FINAL VERIFICATION
      # ==========================================================

      - name: Final Verification
        shell: bash
        run: |
          test -f "$FINAL_APK"

          echo ""
          echo "======================================"
          echo "MY LIFE V1.9 READY"
          echo "======================================"
          echo ""
          echo "Package:"
          echo "com.mylife.app"
          echo ""
          echo "Version:"
          echo "1.9.0"
          echo ""
          echo "Version Code:"
          echo "10"
          echo ""
          echo "Features:"
          echo "- Calendar keeps old goals/events"
          echo "- Past + today + future events"
          echo "- Step counter"
          echo "- Distance in kilometers"
          echo "- Calories burned"
          echo "- Food calorie equivalents"
          echo "- Permanent signing key"
          echo ""

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload My Life V1.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V1.9-CALENDAR-STEPS-UPDATE
          path: apk-output/My-Life-V1.9-CALENDAR-STEPS-UPDATE.apk
          if-no-files-found: error
          retention-days: 30

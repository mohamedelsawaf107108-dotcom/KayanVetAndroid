name: Build My Life V2.5 Premium Focus 60-30

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build My Life V2.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find And Extract My Life V2.5 ZIP
        shell: bash
        run: |
          echo "Searching for My Life V2.5 ZIP..."

          ZIP_PATH=$(find . -maxdepth 5 -type f \
            \( \
              -iname "*MyLife*V2.5*.zip" \
              -o -iname "*My-Life*V2.5*.zip" \
              -o -iname "*FOCUS*60*30*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: My Life V2.5 project ZIP not found."
            echo "Files found in repository:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_PATH"

          rm -rf "$GITHUB_WORKSPACE/mylife_build"
          mkdir -p "$GITHUB_WORKSPACE/mylife_build"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/mylife_build"

          echo "Project extracted successfully."

          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/mylife_build" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/mylife_build" -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Verify Android Project
        shell: bash
        run: |
          echo "Verifying project..."

          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project structure OK."

      - name: Verify Package And Version
        shell: bash
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          grep -q "applicationId 'com.mylife.app'" "$BUILD_FILE"
          grep -q "versionCode 16" "$BUILD_FILE"
          grep -q "versionName '2.5.0'" "$BUILD_FILE"

          echo "Package verified: com.mylife.app"
          echo "Version verified: 2.5.0"
          echo "Version Code verified: 16"

      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/app/mylife-release.jks" ]; then
            echo "Permanent signing key found."
          else
            echo "ERROR: app/mylife-release.jks not found."
            echo "Build stopped to protect update compatibility."
            exit 1
          fi

      - name: Verify Focus Timer
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Focus 60/30 system..."

          grep -qi "focus" "$INDEX_FILE" || true
          grep -q "60" "$INDEX_FILE" || true
          grep -q "30" "$INDEX_FILE" || true

          echo "Focus check completed."

      - name: Verify Five Life Pillars
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "روحي" "$INDEX_FILE" || true
          grep -q "صحي" "$INDEX_FILE" || true
          grep -q "شخصي" "$INDEX_FILE" || true
          grep -q "مهني" "$INDEX_FILE" || true
          grep -q "مادي" "$INDEX_FILE" || true

          echo "Five Life Pillars check completed."

      - name: Verify Step Counter
        shell: bash
        run: |
          JAVA_DIR="$PROJECT_DIR/app/src/main/java"

          if grep -R -q "TYPE_STEP_COUNTER" "$JAVA_DIR"; then
            echo "Native Step Counter found."
          else
            echo "ERROR: TYPE_STEP_COUNTER missing."
            exit 1
          fi

      - name: Verify Activity Recognition Permission
        shell: bash
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if grep -q "ACTIVITY_RECOGNITION" "$MANIFEST"; then
            echo "ACTIVITY_RECOGNITION permission found."
          else
            echo "ERROR: ACTIVITY_RECOGNITION permission missing."
            exit 1
          fi

      - name: Verify Health System
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "weightHistory" "$INDEX_FILE" || true
          grep -q "targetWeight" "$INDEX_FILE" || true
          grep -q "BMI" "$INDEX_FILE" || true
          grep -q "تسجيل الوزن" "$INDEX_FILE" || true

          echo "Health system check completed."

      - name: Verify Calendar
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "كل المحفوظ" "$INDEX_FILE" || true

          echo "Calendar check completed."

      - name: Verify Quran And Adhkar
        shell: bash
        run: |
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "القرآن" "$INDEX_FILE" || true
          grep -q "أذكار الصباح" "$INDEX_FILE" || true
          grep -q "أذكار المساء" "$INDEX_FILE" || true

          echo "Quran and Adhkar check completed."

      - name: Build Signed Release APK
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILDING MY LIFE V2.5"
          echo "PREMIUM FOCUS 60 / 30"
          echo "=========================================="

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper..."

            chmod +x ./gradlew || true

            bash ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.9..."

            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          fi

      - name: Find Signed Release APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed Release APK not found."

            echo "Build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "Signed APK found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/My-Life-V2.5-PREMIUM-FOCUS-60-30.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo "Final APK prepared:"
          ls -lh "$FINAL_APK"

      - name: Final Build Information
        shell: bash
        run: |
          echo "=========================================="
          echo "MY LIFE V2.5 BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Package: com.mylife.app"
          echo "Version: 2.5.0"
          echo "Version Code: 16"
          echo ""
          echo "Included:"
          echo "- Premium Home"
          echo "- Five Life Pillars"
          echo "- Professional Pillar"
          echo "- Financial Pillar"
          echo "- Focus 60 minutes"
          echo "- Break 30 minutes"
          echo "- Live Focus Countdown"
          echo "- Daily Weight Log"
          echo "- Target Weight"
          echo "- BMI"
          echo "- Weight History"
          echo "- Weekly Weight Progress"
          echo "- Step Counter"
          echo "- Distance"
          echo "- Calories"
          echo "- Calendar"
          echo "- Old and New Events"
          echo "- Prayer Times"
          echo "- Quran"
          echo "- Daily Wird"
          echo "- Morning Adhkar"
          echo "- Evening Adhkar"
          echo "- Backup / Import / Export"
          echo ""
          echo "APK READY."

      - name: Upload My Life V2.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V2.5-PREMIUM-FOCUS-60-30
          path: apk-output/My-Life-V2.5-PREMIUM-FOCUS-60-30.apk
          if-no-files-found: error
          retention-days: 30

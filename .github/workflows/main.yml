name: Build Kayan Vet Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and Extract Kayan Vet ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "KayanVetAndroid_V3.0.1_SIMPLE_FIXED_SIGNING*.zip" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Kayan Vet V3.0.1 ZIP file was not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found after extraction"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        shell: bash
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build Signed Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Find Signed APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p apk-output
          cp "$APK" \
            "apk-output/Kayan-Vet-Hospital-V3.0.1-SIGNED.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.0.1-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.0.1-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

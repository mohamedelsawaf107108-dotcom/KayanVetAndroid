name: Build My Life V1.4 Permanent Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Permanent Signed Release APK
        shell: bash
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Verify Signed APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp app/build/outputs/apk/release/app-release.apk \
             apk-output/My-Life-V1.4-PERMANENT-SIGNED.apk

          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-V1.4-PERMANENT-SIGNED
          path: apk-output/My-Life-V1.4-PERMANENT-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

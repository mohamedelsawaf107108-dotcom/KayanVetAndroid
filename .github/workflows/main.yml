name: Build Kayan Vet V3.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kayan Vet Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for gradlew..."

          GRADLEW_PATH=$(find . -maxdepth 4 -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere in repository"
            echo "Repository contents:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "Gradle wrapper found at: $GRADLEW_PATH"
          echo "Android project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW_PATH"

      - name: Restore Google Services File
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is missing"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"

          echo "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/app/google-services.json"

          echo "google-services.json restored successfully"

      - name: Restore Signing Keystore
        shell: bash
        env:
          KAYAN_KEYSTORE_BASE64: ${{ secrets.KAYAN_KEYSTORE_BASE64 }}

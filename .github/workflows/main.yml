name: Build Kayan Vet V2.4 Safe Storage

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kayan Vet V2.4
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Kayan Vet Project
        shell: bash
        run: |
          echo "Searching for Kayan Vet ZIP..."

          ZIP_PATH=$(find . -maxdepth 5 -type f \
            \( \
              -iname "*Kayan*Vet*.zip" \
              -o -iname "*KayanVet*.zip" \
              -o -iname "*KAYAN*.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: Kayan Vet ZIP not found."
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP found: $ZIP_PATH"

      - name: Extract Kayan Vet Project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/kayan_build"
          mkdir -p "$GITHUB_WORKSPACE/kayan_build"

          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/kayan_build"

          echo "Project extracted."

      - name: Find Android Project
        shell: bash
        run: |
          SETTINGS_PATH=$(find "$GITHUB_WORKSPACE/kayan_build" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found."
            find "$GITHUB_WORKSPACE/kayan_build" -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Force Gradle Wrapper 8.11.1
        shell: bash
        run: |
          WRAPPER_FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER_FILE" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
              "$WRAPPER_FILE"

            echo "Gradle Wrapper changed to 8.11.1"
            cat "$WRAPPER_FILE"
          else
            echo "No gradle-wrapper.properties found."
            echo "Installed Gradle 8.11.1 will be used."
          fi

      - name: Verify Android Project
        shell: bash
        run: |
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project structure OK."

      - name: Show Application Information
        shell: bash
        run: |
          echo "======================================"
          echo "APPLICATION INFORMATION"
          echo "======================================"

          grep -E \
            "applicationId|versionCode|versionName" \
            "$PROJECT_DIR/app/build.gradle" \
            || true

      - name: Verify Signing Key
        shell: bash
        run: |
          KEYSTORE_PATH=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -iname "*.jks" \
              -o -iname "*.keystore" \
            \) \
            | head -n 1)

          if [ -n "$KEYSTORE_PATH" ]; then
            echo "Signing key found:"
            echo "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "WARNING: Signing key not found."
          fi

      - name: Build Release APK
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING KAYAN VET"
          echo "GRADLE 8.11.1"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true

            ./gradlew \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          else
            gradle \
              clean \
              assembleRelease \
              --stacktrace \
              --no-daemon
          fi

      - name: Find Release APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null \
              | sort \
              || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK found:"
          echo "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Prepare Final APK
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          FINAL_APK="$GITHUB_WORKSPACE/apk-output/Kayan-Vet-V2.4-SAFE-STORAGE-SEARCH.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          ls -lh "$FINAL_APK"

      - name: Final Build Information
        shell: bash
        run: |
          echo "======================================"
          echo "KAYAN VET BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Gradle: 8.11.1"
          echo "Android SDK: 35"
          echo ""
          echo "APK READY"

      - name: Upload Kayan Vet APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-V2.4-SAFE-STORAGE-SEARCH
          path: apk-output/Kayan-Vet-V2.4-SAFE-STORAGE-SEARCH.apk
          if-no-files-found: error
          retention-days: 30

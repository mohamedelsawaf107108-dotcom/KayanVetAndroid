name: Build My Life V1.5 Permanent Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build My Life V1.5
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find My Life V1.5 ZIP
        shell: bash
        run: |
          echo "Searching for My Life V1.5..."

          ZIP_PATH=$(find . -maxdepth 2 -type f \
            -name "*MyLife*V1.5*.zip" \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: My Life V1.5 ZIP not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Extract My Life V1.5
        shell: bash
        run: |
          rm -rf mylife_build
          mkdir -p mylife_build

          unzip -q "$ZIP_PATH" -d mylife_build

          SETTINGS_PATH=$(find mylife_build \
            -type f \
            -name "settings.gradle" \
            | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle not found"
            find mylife_build -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify My Life Project
        shell: bash
        run: |
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verified"

      - name: Verify Permanent Package
        shell: bash
        run: |
          grep -q "applicationId 'com.mylife.app'" \
            "$PROJECT_DIR/app/build.gradle"

          echo "Package verified: com.mylife.app"

      - name: Verify Version
        shell: bash
        run: |
          grep -q "versionName '1.5.0'" \
            "$PROJECT_DIR/app/build.gradle"

          echo "Version verified: 1.5.0"

      - name: Verify Permanent Signing Key
        shell: bash
        run: |
          if [ ! -f "$PROJECT_DIR/app/mylife-release.jks" ]; then
            echo "ERROR: mylife-release.jks not found"
            ls -la "$PROJECT_DIR/app"
            exit 1
          fi

          echo "Permanent signing key found"

      - name: Build Permanent Signed Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find Release APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | grep -v "unsigned" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed Release APK not found"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Locate APK Signer
        shell: bash
        run: |
          APKSIGNER_PATH=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER_PATH" ]; then
            echo "ERROR: apksigner not found"
            find "$ANDROID_HOME/build-tools" -maxdepth 3 -type f || true
            exit 1
          fi

          echo "APK Signer found:"
          echo "$APKSIGNER_PATH"

          echo "APKSIGNER_PATH=$APKSIGNER_PATH" >> "$GITHUB_ENV"

      - name: Verify Signed APK
        shell: bash
        run: |
          echo "Checking APK signature..."

          bash "$APKSIGNER_PATH" verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

          echo ""
          echo "APK signature verified successfully"

      - name: Show APK Information
        shell: bash
        run: |
          echo "APK file:"
          ls -lh "$APK_PATH"

          AAPT_PATH=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aapt" \
            | sort -V \
            | tail -n 1)

          if [ -n "$AAPT_PATH" ]; then
            "$AAPT_PATH" dump badging "$APK_PATH" | head -n 10 || true
          fi

      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p apk-output

          cp "$APK_PATH" \
            "apk-output/My-Life-V1.5-PERMANENT-SIGNED.apk"

          echo "Final APK ready:"
          ls -lh apk-output

      - name: Upload My Life V1.5 APK
        uses: actions

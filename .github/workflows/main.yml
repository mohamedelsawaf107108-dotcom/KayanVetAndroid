name: Build Kayan Vet V3.2.4 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1) Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2) Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3) Gradle 8.11.1
      # ============================================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ============================================================
      # 4) البحث عن ZIP النسخة الحالية وفك الضغط
      # ============================================================
      - name: Find and Extract Kayan Vet V3.2.4
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "Searching for Kayan Vet V3.2.4 ZIP..."
          echo "============================================"

          ZIP_FILE=$(find . -maxdepth 5 -type f \
            -name "KayanVetAndroid_V3.2.4_DASHBOARD_BUNDLED_BACKUP_RUNTIME_FIXED_LIVE_SYNC_FIXED_SIGNING*.zip" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V3.2.4 ZIP file was not found."
            echo ""
            echo "Files currently available:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(find extracted_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found after extraction."
            find extracted_project -maxdepth 6 -type f
            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 5) الملفات الأساسية
      # ============================================================
      - name: Verify Required Project Files
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/kayan-vet-release.keystore"

          echo "All required project files are present."


      # ============================================================
      # 6) AndroidX + Jetifier
      # ============================================================
      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          if grep -Fq "android.useAndroidX=" "$PROJECT_DIR/gradle.properties"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          if grep -Fq "android.enableJetifier=" "$PROJECT_DIR/gradle.properties"; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          echo ""
          cat "$PROJECT_DIR/gradle.properties"


      # ============================================================
      # 7) Version
      # ============================================================
      - name: Verify Version V3.2.4
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT_DIR/app/build.gradle"

          echo "Checking version..."

          grep -Fq "versionCode 25" "$GRADLE"
          grep -Fq "versionName '3.2.4'" "$GRADLE"

          echo "Version V3.2.4 verified."


      # ============================================================
      # 8) Android SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT_DIR/app/build.gradle"

          grep -Fq "compileSdk 36" "$GRADLE"
          grep -Fq "targetSdk 36" "$GRADLE"

          echo "Android SDK verified."


      # ============================================================
      # 9) Firebase
      # ============================================================
      - name: Verify Firebase Configuration
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          echo "Checking Firebase..."

          grep -Fq "FirebaseFirestore.getInstance()" "$MAIN"

          grep -Fq '"medicines"' "$MAIN"
          grep -Fq '"feed"' "$MAIN"
          grep -Fq '"horses"' "$MAIN"
          grep -Fq '"cases"' "$MAIN"
          grep -Fq '"moves"' "$MAIN"
          grep -Fq '"revenues"' "$MAIN"

          echo "Firebase verified."


      # ============================================================
      # 10) Internet Permission
      # ============================================================
      - name: Verify Internet Permission
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -Fq "android.permission.INTERNET" "$MANIFEST"

          echo "Internet permission verified."


      # ============================================================
      # 11) Live Sync
      # ============================================================
      - name: Verify Live Firestore Sync
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Live Sync..."

          grep -Fq "ListenerRegistration" "$MAIN"
          grep -Fq "startRealtimeCloudSync" "$MAIN"
          grep -Fq "addSnapshotListener" "$MAIN"
          grep -Fq "scheduleRealtimeCloudRefresh" "$MAIN"
          grep -Fq "readAllCloudData" "$MAIN"

          grep -Fq "KayanRealtimeConnected" "$HTML"

          echo "Live Sync verified."


      # ============================================================
      # 12) Dashboard
      # ============================================================
      - name: Verify Dashboard Runtime Fix
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking dashboard..."

          grep -Fq "function renderDashboard()" "$HTML"
          grep -Fq "function renderAll(){renderDashboard();" "$HTML"

          grep -Fq "dashHorseTotal" "$HTML"
          grep -Fq "dashOccupiedBoxes" "$HTML"
          grep -Fq "dashVacantBoxes" "$HTML"
          grep -Fq "recentMoves" "$HTML"

          echo "Dashboard runtime fix verified."


      # ============================================================
      # 13) Bundled Backup Runtime Fix
      # ============================================================
      - name: Verify Bundled Backup Runtime Fix
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking bundled backup handling..."

          grep -Fq "function KayanBundledBackupLoaded(jsonText)" "$HTML"
          grep -Fq "kayanSafeMergeDB(incoming,db)" "$HTML"
          grep -Fq "try{renderAll();}catch(renderErr)" "$HTML"

          grep -Fq \
            "تعذر دمج نسخة الكمبيوتر، لكن البيانات الحالية لم يتم حذفها." \
            "$HTML"

          echo "Bundled backup runtime fix verified."


      # ============================================================
      # 14) Full Backup
      # ============================================================
      - name: Verify Full Backup
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          grep -Fq "exportFullBackup" "$HTML"
          grep -Fq "exportBackup" "$MAIN"

          echo "Full Backup verified."


      # ============================================================
      # 15) Safe Restore
      # ============================================================
      - name: Verify Safe Backup Restore
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking Safe Restore..."

          grep -Fq "kayanSafeMergeDB" "$HTML"
          grep -Fq "kayanNormalizeDB" "$HTML"

          grep -Fq \
            "kayanNormalizeDB(kayanSafeMergeDB(db,x))" \
            "$HTML"

          if grep -Eq '\bdb[[:space:]]*=[[:space:]]*x\b' "$HTML"; then
            echo "ERROR: Old destructive db=x restore detected."
            exit 1
          fi

          echo "Safe Restore verified."


      # ============================================================
      # 16) سجل الحركات
      # ============================================================
      - name: Verify Full Movement History
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking movement history..."

          grep -Fq "function renderMoves()" "$HTML"
          grep -Fq "عرض كل الحركات بدون أي حد أقصى" "$HTML"
          grep -Fq "movesVisibleCount" "$HTML"

          # حماية سجل الحركات من حذف جهاز آخر
          grep -Fq 'if (!"moves".equals(name))' "$MAIN"

          echo "Movement history verified."


      # ============================================================
      # 17) Medicine Stock
      # ============================================================
      - name: Verify Medicine Stock
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "openStockModal('medicine','in')" "$HTML"
          grep -Fq "openStockModal('medicine','out')" "$HTML"

          echo "Medicine stock verified."


      # ============================================================
      # 18) Feed Stock
      # ============================================================
      - name: Verify Feed Stock
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "openStockModal('feed','in')" "$HTML"
          grep -Fq "openStockModal('feed','out')" "$HTML"

          echo "Feed stock verified."


      # ============================================================
      # 19) جهات الصرف
      # ============================================================
      - name: Verify Dispensing Destinations
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking dispensing destinations..."

          grep -Fq "function getDispenseDestinations()" "$HTML"

          grep -Fq "Array.from({length:10}" "$HTML"
          grep -Fq "'الكلية الحربية'" "$HTML"
          grep -Fq "'الأوليمبية'" "$HTML"

          echo "Dispensing destinations verified."


      # ============================================================
      # 20) 10 Stables × 25 Boxes
      # ============================================================
      - name: Verify Stable Structure
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "Array.from({length:10}" "$HTML"
          grep -Fq "Array.from({length:25}" "$HTML"

          echo "10 stables x 25 boxes verified."


      # ============================================================
      # 21) بيانات الخيل
      # ============================================================
      - name: Verify Horse Data
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking horse information..."

          grep -Fq 'name="imageFile"' "$HTML"
          grep -Fq 'name="passportImageFile"' "$HTML"

          grep -Fq "birthDate" "$HTML"
          grep -Fq "calculateHorseAge" "$HTML"

          grep -Fq 'name="weight"' "$HTML"
          grep -Fq 'name="height"' "$HTML"

          grep -Fq "passportNo" "$HTML"
          grep -Fq "ownership" "$HTML"
          grep -Fq "rider" "$HTML"
          grep -Fq "horseType" "$HTML"
          grep -Fq "workStatus" "$HTML"

          echo "Horse information verified."


      # ============================================================
      # 22) Horse QR
      # ============================================================
      - name: Verify Horse QR
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          grep -Fq "function openHorseQR(id)" "$HTML"
          grep -Fq "generateQr" "$HTML"
          grep -Fq "generateQr" "$MAIN"

          echo "Horse QR verified."


      # ============================================================
      # 23) التقرير الشامل للحصان
      # ============================================================
      - name: Verify Horse Comprehensive Report
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking comprehensive horse report..."

          grep -Fq "function openHorseReport(id)" "$HTML"

          grep -Fq "الحالات المرضية" "$HTML"
          grep -Fq "الأدوية المصروفة للحصان" "$HTML"

          grep -Fq "feedHistory" "$HTML"
          grep -Fq "recordFeedingChange" "$HTML"

          echo "Horse comprehensive report verified."


      # ============================================================
      # 24) نظام التغذية
      # ============================================================
      - name: Verify Feeding System
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking six daily feeding slots..."

          grep -Fq 'name="feed05"' "$HTML"
          grep -Fq 'name="light08"' "$HTML"
          grep -Fq 'name="feed11"' "$HTML"
          grep -Fq 'name="feed17"' "$HTML"
          grep -Fq 'name="light20"' "$HTML"
          grep -Fq 'name="feed23"' "$HTML"

          echo "Six feeding slots verified."

          echo "Checking feed calculations..."

          grep -Fq "function v2NormFeedName" "$HTML"
          grep -Fq "function v2FeedPackageKg" "$HTML"
          grep -Fq "function v2FeedStockKg" "$HTML"
          grep -Fq "function v2FeedConsumption" "$HTML"
          grep -Fq "function v2RenderFeedConsumption" "$HTML"

          grep -Fq "if(qty>25)" "$HTML"

          grep -Fq "monthly=daily*30" "$HTML"

          grep -Fq \
            "let items=(db.feed||[]).filter(x=>v2NormFeedName(x.name)===key);" \
            "$HTML"

          grep -Fq \
            "let stockKg=items.reduce((sum,item)=>sum+v2FeedStockKg(item),0)" \
            "$HTML"

          grep -Fq \
            "days=daily?stockKg/daily:0" \
            "$HTML"

          echo "Feed calculations verified."


      # ============================================================
      # 25) Date Entry
      # ============================================================
      - name: Verify Easy Date Entry
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "kayanDateTyping" "$HTML"
          grep -Fq "29082026" "$HTML"

          echo "Easy date entry verified."


      # ============================================================
      # 26) Admin / User Permissions
      # ============================================================
      - name: Verify User Permissions
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking permissions..."

          grep -Fq "requireAdmin" "$HTML"
          grep -Fq "readonly-user" "$HTML"

          grep -Fq \
            "new Set(['dashboard','horses','stables','cases'])" \
            "$HTML"

          grep -Fq "admin-only" "$HTML"

          echo "Permissions verified."


      # ============================================================
      # 27) Hospital Revenues
      # ============================================================
      - name: Verify Hospital Revenues
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          echo "Checking revenues..."

          grep -Fq 'id="revenues"' "$HTML"
          grep -Fq 'data-view="revenues"' "$HTML"

          grep -Fq "openRevenueModal" "$HTML"
          grep -Fq "saveRevenue" "$HTML"
          grep -Fq "function renderRevenues()" "$HTML"

          grep -Fq "revenueMonth" "$HTML"

          grep -Fq '"revenues"' "$MAIN"

          echo "Hospital revenues verified."


      # ============================================================
      # 28) التقارير الشهرية
      # ============================================================
      - name: Verify Monthly Report
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "reportMonth" "$HTML"
          grep -Fq "monthlyDataForKey" "$HTML"
          grep -Fq "renderReports" "$HTML"

          echo "Monthly report verified."


      # ============================================================
      # 29) التقارير السنوية
      # ============================================================
      - name: Verify Annual Report
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "reportYear" "$HTML"
          grep -Fq "getAnnualReportData" "$HTML"
          grep -Fq "renderAnnualReport" "$HTML"

          echo "Annual report verified."


      # ============================================================
      # 30) No Charts
      # ============================================================
      - name: Verify Reports Have No Charts
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking reports contain no charts..."

          if grep -Fq "simpleBarChartHTML(" "$HTML"; then
            echo "ERROR: Chart code still exists."
            exit 1
          fi

          if grep -Fq "renderMonthlyCharts(" "$HTML"; then
            echo "ERROR: Monthly chart code still exists."
            exit 1
          fi

          if grep -Fq "printableChartsHTML(" "$HTML"; then
            echo "ERROR: Printable chart code still exists."
            exit 1
          fi

          if grep -Fq 'id="monthlyCharts"' "$HTML"; then
            echo "ERROR: Monthly chart container still exists."
            exit 1
          fi

          if grep -Fq 'id="annualCharts"' "$HTML"; then
            echo "ERROR: Annual chart container still exists."
            exit 1
          fi

          echo "Reports have no charts."


      # ============================================================
      # 31) Chief Signature
      # ============================================================
      - name: Verify Veterinary Chief Signature
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Fq "رائد / محمد الصواف" "$HTML"
          grep -Fq "رئيس القسم البيطري" "$HTML"

          echo "Chief signature verified."


      # ============================================================
      # 32) Print / PDF
      # ============================================================
      - name: Verify Printing and PDF
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MAIN="$PROJECT_DIR/app/src/main/java/com/kayan/vethospital/MainActivity.java"

          grep -Fq "printReport" "$HTML"

          grep -Fq "printCurrentPage" "$MAIN"
          grep -Fq "PrintManager" "$MAIN"

          echo "Printing/PDF verified."


      # ============================================================
      # 33) Fixed Signing Key
      # ============================================================
      - name: Verify Fixed Signing Key
        shell: bash
        run: |
          set -e

          GRADLE="$PROJECT_DIR/app/build.gradle"

          test -f "$PROJECT_DIR/app/kayan-vet-release.keystore"

          grep -Fq "signingConfigs" "$GRADLE"
          grep -Fq "kayan-vet-release.keystore" "$GRADLE"
          grep -Fq "signingConfig signingConfigs.release" "$GRADLE"

          echo "Fixed signing key verified."


      # ============================================================
      # 34) Gradle Info
      # ============================================================
      - name: Show Gradle Information
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version


      # ============================================================
      # 35) Clean
      # ============================================================
      - name: Clean Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          gradle clean --stacktrace

          echo "Clean completed."


      # ============================================================
      # 36) Build Release
      # ============================================================
      - name: Build Signed Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "Building Kayan Vet Hospital V3.2.4"
          echo "============================================"

          gradle assembleRelease --stacktrace

          echo ""
          echo "Release build completed successfully."


      # ============================================================
      # 37) Find APK
      # ============================================================
      - name: Find Generated Release APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            echo ""
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 38) Verify APK Signature
      # ============================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "Verifying APK signature..."

          jarsigner -verify "$APK"

          echo "APK signature verified."


      # ============================================================
      # 39) Final APK Name
      # ============================================================
      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          FINAL_APK="apk-output/Kayan-Vet-Hospital-V3.2.4-SIGNED.apk"

          cp "$APK" "$FINAL_APK"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh "$FINAL_APK"


      # ============================================================
      # 40) Upload Artifact
      # ============================================================
      - name: Upload Kayan Vet V3.2.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-Vet-Hospital-V3.2.4-SIGNED
          path: apk-output/Kayan-Vet-Hospital-V3.2.4-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
